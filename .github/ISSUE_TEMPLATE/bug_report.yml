name: 🐛 Bug 报告
description: 崩溃、显示错乱、存档丢失等功能性问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    value: |
      感谢反馈！为了能复现，请尽量填全下面几项。
      游戏是纯前端的，数据都留在你自己的浏览器里，上报时不会带走任何存档内容。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 单文件试玩包的文件名里带版本号，例如 v0.2.0
      placeholder: v0.2.0
    validations:
      required: true
  - type: dropdown
    id: how
    attributes:
      label: 运行方式
      options:
        - 单文件 HTML（release/ 里的 offline.html）
        - 本地 npm run dev
        - 自己 build 的 dist
        - 在线站点 / GitHub Pages
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 浏览器与系统
      placeholder: 例如 Chrome 130 / Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从开局开始，一步步怎么走到问题出现
      placeholder: |
        1. 选 port 蓝图，种子 20261020
        2. 把税率拉到 30%
        3. 快进到第 80 个月
        4. 出现 ……
    validations:
      required: true
  - type: textarea
    id: expect
    attributes:
      label: 期望与实际
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台报错（可选）
      description: F12 打开开发者工具，Console 里的红色报错
      render: text
