/* ── 存档：多槽位 + 自定义命名 + 选择读取 ── */
const IDX_KEY = SAVE_KEY + '.index';
const SLOT_KEY = SAVE_KEY + '.slot.';
const ACTIVE_KEY = SAVE_KEY + '.active';
const MAX_SLOTS = 12;
function readIndex() { try { const a = JSON.parse(localStorage.getItem(IDX_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function writeIndex(l) { try { localStorage.setItem(IDX_KEY, JSON.stringify(l)); } catch (e) {} }
function newSlotId() { return 's' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); }
function fmtTime(t) { const d = new Date(t), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function suggestName() {
  return `${ORIENT_INFO[state.orientation][1]}·${curStage().name}·${state.year}年`;
}
function metaOf(id, name, createdAt) {
  return { id, name, createdAt, updatedAt: Date.now(), month: state.t, stageName: curStage().name,
    population: Math.round(state.pop), round: state.cycle.round, unlocked: state.unlocked.length,
    orientation: state.orientation };
}
function saveAsSlot(name) {
  const id = newSlotId();
  let list = readIndex();
  if (list.length >= MAX_SLOTS) { list.sort((a, b) => a.updatedAt - b.updatedAt);
    const drop = list.shift(); if (drop) try { localStorage.removeItem(SLOT_KEY + drop.id); } catch (e) {} }
  const meta = metaOf(id, name, Date.now());
  try { localStorage.setItem(SLOT_KEY + id, JSON.stringify(snapshot())); }
  catch (e) { toast('保存失败：本地存储空间不足'); return null; }
  list.push(meta); writeIndex(list);
  try { localStorage.setItem(ACTIVE_KEY, id); } catch (e) {}
  return id;
}
function overwriteSlot(id, name) {
  const list = readIndex(); const i = list.findIndex(m => m.id === id);
  if (i < 0) return false;
  try { localStorage.setItem(SLOT_KEY + id, JSON.stringify(snapshot())); }
  catch (e) { toast('保存失败：本地存储空间不足'); return false; }
  list[i] = metaOf(id, name || list[i].name, list[i].createdAt); writeIndex(list);
  try { localStorage.setItem(ACTIVE_KEY, id); } catch (e) {}
  return true;
}
function loadSlot(id) {
  try {
    const raw = localStorage.getItem(SLOT_KEY + id);
    if (!raw) return false;
    applySnapshot(JSON.parse(raw));
    try { localStorage.setItem(ACTIVE_KEY, id); } catch (e) {}
    return true;
  } catch (e) { toast('存档已损坏'); return false; }
}
function deleteSlot(id) {
  try { localStorage.removeItem(SLOT_KEY + id); } catch (e) {}
  writeIndex(readIndex().filter(m => m.id !== id));
}
function renameSlot(id, name) {
  const list = readIndex(); const m = list.find(x => x.id === id);
  if (!m) return; m.name = name; m.updatedAt = Date.now(); writeIndex(list);
}
function openSaveDialog() {
  const list = readIndex().sort((a, b) => b.updatedAt - a.updatedAt);
  let active = null; try { active = localStorage.getItem(ACTIVE_KEY); } catch (e) {}
  const rows = list.length ? list.map(m => `
    <div class="save-row ${m.id === active ? 'active' : ''}" data-id="${m.id}">
      <div class="sr-main">
        <div class="sr-name">${m.name}${m.id === active ? '<span class="sr-tag">当前</span>' : ''}</div>
        <div class="sr-meta">${m.stageName} · 第 ${m.month} 月 · 人口 ${m.population.toLocaleString('zh-CN')} · 第 ${m.round} 轮 · 名词 ${m.unlocked}</div>
        <div class="sr-meta">${ORIENT_INFO[m.orientation] ? ORIENT_INFO[m.orientation][1] : '均衡型'} · ${fmtTime(m.updatedAt)}</div>
      </div>
      <div class="sr-ops">
        <button class="sr-btn" data-act="load">读取</button>
        <button class="sr-btn" data-act="save">覆盖</button>
        <button class="sr-btn" data-act="rename">改名</button>
        <button class="sr-btn danger" data-act="del">删除</button>
      </div>
    </div>`).join('') : '<p class="muted">还没有任何存档。在下面起个名字，把当前的城市存下来。</p>';
  showModal(`<div class="chapter">存档管理</div><h2>存档 / 读档</h2>
    <div class="save-new">
      <input id="save-name" type="text" placeholder="给这座城市起个名字" value="${suggestName()}" />
      <button class="close" id="save-new-btn" style="margin:0">存为新档</button>
    </div>
    <h4>已有存档（${list.length}）</h4>
    <div class="save-list">${rows}</div>
    <p class="muted">存档保存在本浏览器本地，换浏览器或清缓存会丢失。</p>
    <button class="close" data-close>关闭</button>`);
  const card = document.querySelector('#concept-modal .card');
  card.querySelector('#save-new-btn').onclick = () => {
    const n = (card.querySelector('#save-name').value || '').trim() || suggestName();
    if (saveAsSlot(n)) { toast(`已保存为「${n}」`); openSaveDialog(); }
  };
  card.querySelectorAll('.save-row').forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll('.sr-btn').forEach(b => {
      b.onclick = () => {
        const act = b.dataset.act;
        const cur = readIndex().find(m => m.id === id);
        if (act === 'load') { if (loadSlot(id)) { closeModal(); toast('已读档'); } }
        else if (act === 'save') { if (overwriteSlot(id, cur && cur.name)) { toast(`已覆盖「${cur ? cur.name : '存档'}」`); openSaveDialog(); } }
        else if (act === 'rename') { const v = window.prompt('新的存档名称', cur ? cur.name : ''); if (v && v.trim()) { renameSlot(id, v.trim()); openSaveDialog(); } }
        else if (act === 'del') { if (window.confirm(`确定删除存档「${cur ? cur.name : ''}」？此操作不可恢复。`)) { deleteSlot(id); toast('已删除'); openSaveDialog(); } }
      };
    });

}

  const card = document.querySelector('#concept-modal .card');
  card.querySelectorAll('.bp-card').forEach(c => c.onclick = () => {
    sel.blueprint = c.dataset.bp;
    card.querySelectorAll('.bp-card').forEach(x => x.classList.toggle('sel', x === c));
  });
  card.querySelectorAll('.rp-btn').forEach(b => b.onclick = () => {
    sel.rounds = Number(b.dataset.r);
    card.querySelectorAll('.rp-btn').forEach(x => x.classList.toggle('sel', x === b));
  });
  card.querySelector('#setup-go').onclick = () => {
    closeModal(); setup = sel; newGame(sel);
  };
}

/* ═══════════════ 11. 启动 ═══════════════ */
function newGame(r) {
  // 只回到开局状态，不销毁存档——否则开新局之后「读档」就失效了
  applySnapshot(INITIAL);
  applyBlueprint(r.blueprint);
  state.cycle.roundsPlanned = r.rounds;
  state.cycle.round = 1; state.cycle.phase = 'household';
  state.cycle.phaseMonths = 0; state.cycle.roundMonths = 0;
  state.cycle.visited = ['household']; state.cycle.lastUnlockMonth = -99;
  state.unlocked = [];
  // 开新城 = 新的周期（从复苏起步）；但已经学会的东西（积分/奖杯）不清零
  state.business = initBC();
  state.quiz = mergeQuiz(state.quiz || emptyQuiz(), loadQuizProfile());
  for (const k in tracking) { for (const j in tracking[k]) delete tracking[k][j]; }
  perspective = 'household'; seenPersp = unlockedPersp();
  developCity(STAGES[0]);
  recomputeFromLevers();
  state.orientation = evaluateOrientation();
  buildGrid(true);
  seedUnlocks();        // 只点亮最浅的一批基础词，其余在游戏里逐个解锁
  updateSeries();
  syncTabs(); renderLegend(); paintCity(); renderTileInfo();
  renderStats(); renderBC(); renderCycle(); renderStage(); renderPolicy(); renderDash(); renderKnowledge();
}
developCity(STAGES[0]);
recomputeFromLevers();
state.orientation = evaluateOrientation();
buildGrid(true);      // 按「村落」的视野建取景
seedUnlocks();        // 点亮最浅的一批基础名词
updateSeries();
state.quiz = mergeQuiz(state.quiz, loadQuizProfile());   // 学习成果跨局留存
const INITIAL = snapshot();
seenPersp = unlockedPersp();

syncTabs(); renderLegend(); paintCity(); renderTileInfo();
renderStats(); renderBC(); renderCycle(); renderStage(); renderPolicy(); renderDash(); renderKnowledge();
openSetup();          // 首次进入先选蓝图与轮数
</script>
