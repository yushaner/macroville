<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MacroVille · 微观城邦（界面预览）</title>
<style>
  :root {
    --bg:#0a0c12; --panel:#12151d; --panel-2:#1a1f2b; --border:#242b3a;
    --text:#e6e9f0; --muted:#8b93a7; --accent:#4f9dff; --warn:#f5a623;
    --bad:#ff5a5a; --good:#2ecc71;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text); font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    overflow:hidden;
  }
  /* 界面缩放：顶栏滑轨改 --ui-zoom，整体等比缩放，不用再去缩放浏览器 */
  #app { display:flex; flex-direction:column; height:calc(100vh / var(--ui-zoom,1)); zoom:var(--ui-zoom,1); }
  #topbar { display:flex; align-items:center; gap:10px; padding:5px 12px; border-bottom:1px solid var(--border); background:var(--panel); }
  .brand { font-weight:700; font-size:15px; letter-spacing:.02em; }
  .brand .sub { color:var(--muted); font-weight:400; font-size:11px; margin-left:4px; }
  .stats { display:flex; gap:12px; color:var(--muted); font-size:12px; }
  .stats b { color:var(--text); }
  .controls { margin-left:auto; display:flex; gap:6px; align-items:center; }
  button {
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 9px; cursor:pointer; font-size:12px; font-family:inherit;
  }
  button:hover { border-color:var(--accent); }
  button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .rules-btn { border-style:dashed; }
  /* 数值口径速查表：把「这个数字是什么单位」摊开讲 */
  .unit-table { width:100%; border-collapse:collapse; margin:8px 0 10px; font-size:12px; }
  .unit-table th, .unit-table td { padding:5px 7px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
  .unit-table th { color:var(--muted); font-weight:600; font-size:11px; }
  .unit-table td b { color:var(--accent); }

  /* 顶部实时变量条：随视角切换，点开有详情与累积曲线 */
  .hud { display:flex; gap:5px; flex:1; flex-wrap:wrap; min-width:0; }
  .hud-chip { display:flex; align-items:center; gap:5px; padding:3px 7px; background:var(--panel-2);
    border:1px solid var(--border); border-radius:6px; cursor:pointer; color:var(--text); font-size:12px; line-height:1.15; }
  .hud-chip:hover { border-color:var(--accent); }
  .hud-chip.warn { border-color:var(--warn); }
  .hc-icon { font-size:12px; }
  .hc-body { display:flex; flex-direction:column; align-items:flex-start; }
  .hc-label { color:var(--muted); font-size:10px; }
  .hc-value { font-weight:700; font-variant-numeric:tabular-nums; font-size:12.5px; }
  .hc-arrow { font-size:9px; margin-left:2px; }
  .hc-arrow.up { color:var(--bad); }
  .hc-arrow.down { color:var(--good); }
  .hc-spark { width:44px; height:15px; }
  .zoom-box { display:flex; align-items:center; gap:4px; padding-left:6px; margin-left:2px; border-left:1px solid var(--border); }
  .zoom-box label { font-size:11px; color:var(--muted); }
  .zoom-box input[type=range] { width:72px; accent-color:var(--accent); }
  .zoom-box .zv { font-size:11px; width:34px; text-align:right; font-variant-numeric:tabular-nums; }

  .tabs { display:flex; align-items:center; gap:10px; padding:6px 14px; border-bottom:1px solid var(--border); }
  .tab { display:flex; align-items:center; gap:6px; padding:5px 13px; border-radius:6px 6px 0 0; }
  .tab-sub { font-size:10px; opacity:.75; }
  .tab.locked { opacity:.5; cursor:not-allowed; border-style:dashed; background:transparent; }
  .tab-group { display:flex; gap:6px; margin-left:auto; }
  .cycle-bar { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11.5px; flex-wrap:wrap; }
  .cycle-bar b { color:var(--text); }
  .cb-round { display:flex; align-items:center; gap:3px; }
  .cb-dot { width:8px; height:8px; border-radius:50%; background:var(--border); }
  .cb-dot.on { background:var(--accent); }
  .cb-dot.now { background:var(--warn); }
  .cb-sep { color:var(--border); }
  .cb-note { color:var(--warn); }
  .stage-orient { margin-left:6px; padding:0 6px; border-radius:999px; background:rgba(79,157,255,.14); color:var(--accent); font-size:10.5px; }

  /* 可拖动的侧栏分隔条 */
  .splitter { flex:none; width:6px; cursor:col-resize; background:var(--border); display:flex; align-items:center; justify-content:center; }
  .splitter:hover, .splitter.dragging { background:var(--accent); }
  .sp-grip { width:2px; height:26px; border-radius:2px; background:var(--muted); }

  /* 侧栏页签：三块面板不再纵向堆叠 */
  .side-tabs { display:flex; gap:4px; }
  .st { flex:1; padding:5px 8px; font-size:12px; border-radius:6px 6px 0 0; border-bottom:none; }
  .st.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .pane { display:none; }
  .pane.active { display:block; }

  /* 变量详情 */
  .det-now { font-size:28px; font-weight:700; font-variant-numeric:tabular-nums; margin:4px 0 8px; }
  .det-chart { width:100%; height:150px; display:block; }
  .det-axis { display:flex; justify-content:space-between; color:var(--muted); font-size:10.5px; }
  .det-stats { margin-top:8px; display:grid; grid-template-columns:1fr 1fr; gap:2px 16px; }
  .det-row { display:flex; justify-content:space-between; font-size:12px; padding:2px 0; border-bottom:1px dashed var(--border); }
  .det-row span { color:var(--muted); }

  /* 存档管理 */
  .save-new { display:flex; gap:6px; margin:8px 0 12px; }
  .save-new input { flex:1; background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 9px; font-size:13px; font-family:inherit; }
  .save-list { display:flex; flex-direction:column; gap:6px; max-height:44vh; overflow-y:auto; }
  .save-row { display:flex; align-items:center; gap:8px; padding:7px 9px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; }
  .save-row.active { border-color:var(--accent); }
  .sr-main { flex:1; min-width:0; }
  .sr-name { font-size:13px; font-weight:600; }
  .sr-tag { margin-left:6px; font-size:10px; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:0 6px; }
  .sr-meta { font-size:11px; color:var(--muted); }
  .sr-ops { display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; max-width:190px; }
  .sr-btn { padding:3px 7px; font-size:11px; }
  .sr-btn.danger:hover { border-color:var(--bad); color:var(--bad); }

  /* 开局蓝图 */
  .bp-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin:8px 0 4px; }
  .bp-card { text-align:left; padding:8px 10px; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; cursor:pointer; }
  .bp-card.sel { border-color:var(--accent); background:rgba(79,157,255,.1); }
  .bp-head { display:flex; align-items:center; gap:5px; font-size:13px; }
  .bp-icon { font-size:15px; }
  .bp-tag { color:var(--warn); font-size:10.5px; margin-left:auto; }
  .bp-desc { font-size:11px; color:var(--muted); line-height:1.5; margin-top:3px; }
  .bp-hint { font-size:10.5px; color:var(--accent); line-height:1.5; margin-top:3px; }
  .round-pick { display:flex; gap:6px; margin:4px 0 10px; }
  .rp-btn { padding:5px 12px; font-size:12.5px; }
  .rp-btn.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
  .setup-actions { display:flex; justify-content:flex-end; }

  main { flex:1; display:flex; min-height:0; }
  #map-panel { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; padding:10px; position:relative; background:var(--panel); border-right:1px solid var(--border); overflow:hidden; }
  #stage-bar { width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; margin-bottom:8px; }
  .stage-head { display:flex; align-items:center; gap:6px; font-size:13px; }
  .stage-steps { margin-left:auto; display:flex; align-items:center; gap:2px; font-size:12px; }
  .stage-step { opacity:.35; }
  .stage-step.on { opacity:1; }
  .stage-arrow { opacity:.3; }
  .stage-track { height:6px; background:var(--panel); border-radius:3px; margin:6px 0 4px; overflow:hidden; }
  .stage-fill { height:100%; background:linear-gradient(90deg,#2e8bff,#4f9dff); }
  .stage-meta { color:var(--muted); font-size:11px; }

  #map-wrap { position:relative; flex:1; min-height:0; display:flex; align-items:center; justify-content:center; width:100%; }
  /* 地图按「当前阶段视野」取景，格子的像素尺寸由可用空间反算，整张图始终完整落在面板里 */
  #city-grid { display:grid; gap:1px; max-width:100%; max-height:100%; align-self:center; }
  .tile { background:#0b0d13; border-radius:1px; cursor:pointer; }
  .tile.void { background:#07080c; cursor:default; opacity:.35; }
  .tile.sel { outline:2px solid var(--accent); outline-offset:-1px; }
  .tile.undeveloped { background:#0b0d13; }

  .map-tools { position:absolute; left:0; top:0; display:flex; flex-wrap:wrap; gap:4px; max-width:250px; z-index:3; }
  .layer-btn { padding:3px 7px; font-size:11px; background:rgba(15,17,23,.86); }
  .tile-info { position:absolute; right:0; top:0; width:210px; z-index:3; background:rgba(15,17,23,.95); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:11px; }
  .tile-info.hidden { display:none; }
  .ti-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; font-size:12px; }
  .ti-close { background:transparent; border:none; color:var(--muted); font-size:14px; padding:0 4px; }
  .ti-row { display:flex; justify-content:space-between; gap:8px; padding:1px 0; }
  .ti-k { color:var(--muted); }
  .ti-v { text-align:right; font-variant-numeric:tabular-nums; }

  .map-legend { position:absolute; left:0; bottom:0; background:rgba(15,17,23,.86); border:1px solid var(--border); border-radius:8px; padding:7px 9px; font-size:10.5px; color:var(--muted); display:flex; flex-direction:column; gap:3px; max-height:70%; overflow:auto; }
  .lg-item { display:flex; align-items:center; gap:6px; }
  .lg-sw { width:11px; height:11px; border-radius:2px; flex:none; }
  .lg-title { color:var(--text); font-weight:600; margin-bottom:2px; }
  .lg-sub { color:var(--muted); font-weight:400; font-size:9.5px; }
  .lg-bar { height:9px; border-radius:3px; background:linear-gradient(90deg,#123a6b,#1d7fa8,#38b764,#f3c13a,#e6484f); }
  .lg-scale { display:flex; justify-content:space-between; font-size:9.5px; }
  .lg-note { font-size:9.5px; line-height:1.4; max-width:165px; }

  #side { width:392px; min-width:340px; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:10px; }
  .panel h3 { margin:0 0 8px; font-size:12.5px; color:var(--muted); font-weight:600; display:flex; justify-content:space-between; }

  .kpi-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
  .kpi { background:var(--panel-2); border-radius:6px; padding:7px 8px; border:1px solid transparent; }
  .kpi .k { color:var(--muted); font-size:10.5px; }
  .kpi .v { font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .kpi.warn { border-color:rgba(245,166,35,.55); }
  .kpi.locked { border:1px dashed var(--border); background:transparent; }
  .kpi.locked .v { font-size:10.5px; font-weight:400; color:var(--muted); }
  .kpi .k-why { margin-top:3px; font-size:9.5px; line-height:1.35; color:var(--muted); opacity:.85; }
  .req-bar { height:4px; background:var(--panel); border-radius:3px; margin:8px 0 2px; overflow:hidden; }
  .req-fill { height:100%; background:linear-gradient(90deg,#2e8bff,#4f9dff); }

  .hints { margin-top:9px; border-top:1px dashed var(--border); padding-top:7px; }
  .hints-title { color:var(--warn); font-size:11.5px; font-weight:600; margin-bottom:3px; }
  .hint-item { color:var(--muted); font-size:11px; line-height:1.6; }

  .slider-row { display:grid; grid-template-columns:86px 1fr 44px; align-items:center; gap:8px; margin:6px 0; font-size:11.5px; }
  .slider-row label { color:var(--muted); cursor:help; }
  .slider-row input[type=range] { width:100%; accent-color:var(--accent); }
  .slider-row .val { text-align:right; font-variant-numeric:tabular-nums; }
  .slider-row.locked-row { grid-template-columns:1fr auto; opacity:.55; }
  .lock-note { font-size:10px; color:var(--muted); }

  .kchapter { display:flex; justify-content:space-between; color:var(--muted); font-size:10.5px; margin:8px 0 3px; letter-spacing:.03em; }
  .k-count { color:var(--accent); font-size:10.5px; }
  .kterms { display:flex; flex-wrap:wrap; gap:4px; }
  .kchip { padding:2px 7px; font-size:10.5px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border); color:var(--text); cursor:pointer; white-space:nowrap; }
  .kchip.unlocked { border-color:rgba(79,157,255,.5); }
  .kchip.locked { opacity:.42; }
  .kchip:hover { border-color:var(--accent); }

  .modal { position:fixed; inset:0; background:rgba(0,0,0,.62); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal.hidden { display:none; }
  .modal .card { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px 18px; max-width:560px; max-height:82vh; overflow:auto; }
  .modal h2 { margin:2px 0 10px; font-size:17px; }
  .modal h4 { margin:12px 0 3px; font-size:12px; color:var(--accent); }
  .modal p { margin:0; color:#c9cfdc; font-size:12.5px; line-height:1.65; }
  .modal .muted { color:var(--muted); font-size:11.5px; }
  .chapter { color:var(--muted); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; }
  .modal .close { margin-top:14px; }
  .tag { display:inline-block; background:var(--panel-2); border:1px solid var(--border); border-radius:4px; padding:1px 6px; margin:2px 4px 0 0; font-size:11px; color:var(--muted); }

  .toast { position:fixed; top:56px; left:50%; transform:translateX(-50%) translateY(-8px); background:rgba(30,38,54,.96); border:1px solid var(--accent); color:var(--text); padding:7px 14px; border-radius:7px; font-size:12px; opacity:0; pointer-events:none; transition:all .18s; z-index:80; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* 经济周期指示条：阶段 + 景气指数条 + 产出缺口 */
  .bc-status { display:flex; align-items:center; gap:7px; padding:3px 8px; border:1px solid var(--border);
    border-radius:6px; background:var(--panel-2); cursor:pointer; font-size:11.5px; flex:0 0 auto; }
  .bc-status:hover { border-color:var(--accent); }
  .bc-phase { font-weight:700; }
  .bc-ph-boom { color:#ff7a7a; } .bc-ph-recession { color:#f5a623; }
  .bc-ph-depression { color:#6ea8ff; } .bc-ph-recovery { color:#2ecc71; }
  .bc-bar { position:relative; width:78px; height:6px; border-radius:3px;
    background:linear-gradient(90deg,#2f6ea8,#3a4a63 48%,#3a4a63 52%,#c9603f); overflow:visible; }
  .bc-bar i { position:absolute; top:-2px; width:3px; height:10px; margin-left:-1.5px; background:var(--text);
    border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,.5); }
  .bc-num { font-variant-numeric:tabular-nums; color:var(--text); }
  .bc-gap { color:var(--muted); } .bc-gap.up { color:#ff8a8a; } .bc-gap.down { color:#6fd3a0; }
  .bc-mon { color:var(--muted); }

  /* 闯关问答 */
  .quiz-box { margin-top:10px; border:1px solid var(--border); border-radius:8px; padding:10px; background:var(--panel-2); }
  .quiz-stem { font-size:13px; line-height:1.6; margin-bottom:9px; }
  .quiz-opts { display:flex; flex-direction:column; gap:6px; }
  .quiz-opt { display:flex; align-items:flex-start; gap:7px; text-align:left; padding:7px 9px; font-size:12.5px; line-height:1.5; }
  .quiz-opt .qo-key { flex:0 0 auto; font-weight:700; color:var(--muted); }
  .quiz-opt.on { border-color:var(--accent); background:rgba(79,157,255,.14); }
  .quiz-opt.right { border-color:var(--good); background:rgba(46,204,113,.16); }
  .quiz-opt.picked { border-color:var(--bad); background:rgba(255,90,90,.14); }
  .quiz-tip { margin-top:8px; font-size:11px; color:var(--muted); }
  .quiz-actions { display:flex; gap:8px; margin-top:10px; }
  .quiz-submit { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  .quiz-submit:disabled { opacity:.45; cursor:not-allowed; }
  .quiz-feedback { margin-top:10px; border-top:1px dashed var(--border); padding-top:9px; }
  .quiz-feedback.hidden { display:none; }
  .qf-head { font-weight:700; margin-bottom:6px; }
  .qf-head.ok { color:var(--good); } .qf-head.no { color:var(--bad); }
  .qf-ans { font-size:12px; color:var(--muted); margin-bottom:6px; }
  .quiz-trophy { margin-top:8px; padding:6px 8px; border-radius:6px; background:rgba(245,166,35,.14);
    border:1px solid var(--warn); font-size:12px; }
  .det-chart { width:100%; height:150px; display:block; }

  /* 学习档案 / 奖杯 */
  .qs-btn { border-style:dashed; }
  .qs-icon { font-size:12px; }
  .tro-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:6px; }
  .tro { display:flex; flex-direction:column; gap:1px; padding:6px 8px; border:1px solid var(--border);
    border-radius:6px; background:var(--panel-2); opacity:.55; }
  .tro.got { opacity:1; border-color:var(--warn); background:rgba(245,166,35,.10); }
  .tro-icon { font-size:15px; }
  .tro-name { font-size:12px; font-weight:700; }
  .tro-desc { font-size:10px; color:var(--muted); }
  .kchip.mark-ok::after { content:'✓'; margin-left:3px; color:var(--good); }
  .kchip.mark-wrong::after { content:'✗'; margin-left:3px; color:var(--bad); }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">MacroVille <span class="sub">微观城邦</span></div>
    <div id="hud" class="hud"></div>
    <div id="controls" class="controls"></div>
  </header>
  <nav id="tabs" class="tabs">
    <div id="bc-status" class="bc-status" title="经济周期：点开看景气曲线与周期形状"></div>
    <div id="cycle-bar" class="cycle-bar"></div>
    <div id="tab-group" class="tab-group"></div>
  </nav>
  <main>
    <section id="map-panel">
      <div id="stage-bar"></div>
      <div id="map-wrap">
        <div id="map-tools" class="map-tools"></div>
        <div id="city-grid"></div>
        <div id="tile-info" class="tile-info hidden"></div>
        <div id="map-legend" class="map-legend"></div>
      </div>
    </section>
    <div id="splitter" class="splitter" title="拖动调整侧栏宽度"><span class="sp-grip"></span></div>
    <aside id="side">
      <div class="side-tabs">
        <button class="st active" data-pane="policy">政策</button>
        <button class="st" data-pane="dash">指标</button>
        <button class="st" data-pane="know">图谱</button>
      </div>
      <div class="pane active" id="pane-policy"><div class="panel" id="policy"></div></div>
      <div class="pane" id="pane-dash"><div class="panel" id="dashboard"></div></div>
      <div class="pane" id="pane-know"><div class="panel" id="knowledge"></div></div>
    </aside>
  </main>
</div>

<script id="quiz-data" type="application/json">[["opportunityCost","single","某人有一份月薪 8000 元的工作，现在打算辞职全职读研，每年学费与生活费共 40000 元。他读研一年的机会成本是：",["40000 元","96000 元","136000 元","56000 元"],[2],"机会成本 = 放弃的最高价值替代选项。既包括显性的学费生活费 4 万，也包括放弃的工资收入 9.6 万，合计 13.6 万。","中级经济师·经济基础知识·第一章 市场需求、供给与均衡价格"],["supplyDemand","single","在其他条件不变时，某商品的生产技术大幅进步，会导致该商品：",["需求曲线右移，价格上升","供给曲线右移，价格下降","供给曲线左移，价格上升","需求曲线左移，价格下降"],[1],"技术进步降低生产成本，供给增加、供给曲线右移，在需求不变时均衡价格下降、均衡数量增加。注意区分「供给量的变动」与「供给的变动」。","中级经济师·经济基础知识·第一章"],["demand","single","下列因素中，会使某种商品的需求曲线发生整体平移的是：",["该商品自身价格变动","消费者收入水平变动","该商品替代品价格变动","B 和 C 都会"],[3],"商品自身价格变动只引起「需求量的变动」（沿曲线移动）；收入、偏好、相关商品价格、预期、消费者数量变动才会使整条需求曲线平移。","中级经济师·经济基础知识·第一章"],["supply","single","短期内，影响某种商品供给弹性大小的最主要因素是：",["生产周期与生产能力调整的难易程度","消费者的偏好","该商品在预算中所占比重","替代品的可获得性"],[0],"供给弹性取决于生产者调整产量的难易：时间越长、要素越易获得，供给弹性越大。B、C、D 是影响需求弹性的因素。","中级经济师·经济基础知识·第一章"],["population","single","在其他条件不变的情况下，一个地区劳动年龄人口占比上升，通常会使该地区的：",["劳动力供给增加，潜在产出提高","劳动力需求立即同比例增加","自然失业率必然上升","物价水平必然下降"],[0],"劳动年龄人口占比上升扩大了劳动力供给，从而提高潜在产出；但需求不会自动同比例增加，反而可能带来就业压力。","中级经济师·经济基础知识·第五章 国民收入核算"],["employmentRate","single","某城市劳动年龄人口 100 万，其中就业人口 76 万，失业人口 4 万，其余不参与劳动力市场。该城市的就业率为：",["76%","95%","80%","79.2%"],[1],"就业率 = 就业人口 ÷ 劳动力人口（就业+失业）= 76 ÷ (76+4) = 95%。若除以劳动年龄人口则是劳动参与率口径，注意区分。","中级经济师·经济基础知识·第六章 失业与经济增长"],["unemployment","single","由于产业升级，传统行业的工人技能不匹配新兴岗位需求而长期找不到工作，这类失业属于：",["摩擦性失业","结构性失业","周期性失业","季节性失业"],[1],"结构性失业源于劳动力供给与需求在结构（技能、地区、产业）上的不匹配；周期性失业才是由总需求不足引起的。","中级经济师·经济基础知识·第六章"],["avgWage","single","在劳动力市场上，政府把最低工资标准提高到高于市场均衡工资的水平，最可能产生的直接后果是：",["所有劳动者收入都上升且就业增加","企业用工成本上升，低技能劳动者就业减少","劳动力供给减少","对就业没有任何影响"],[1],"高于均衡水平的最低工资会使企业用工成本上升、用工需求下降，同时吸引更多低技能劳动力进入市场，结果是低技能群体失业增加。","中级经济师·经济基础知识·第一章 / 第六章"],["disposableIncome","single","某居民税前工资收入 10000 元，缴纳个人所得税 1000 元、社会保险 800 元。其可支配收入为：",["10000 元","9000 元","8200 元","9200 元"],[2],"可支配收入 = 收入 − 个人所得税 − 社会保险等经常性转移支出 = 10000 − 1000 − 800 = 8200 元。它是消费与储蓄决策的起点。","中级经济师·经济基础知识·第五章"],["livingStandard","single","衡量居民生活水平时，最不适宜单独作为衡量指标的是：",["人均可支配收入","人均消费支出","名义工资总额","恩格尔系数"],[2],"名义工资总额没有扣除物价变动、没有考虑人口规模与家庭结构，不能反映真实生活水平；应结合实际购买力、人均口径与消费结构综合判断。","中级经济师·经济基础知识·第五章"],["happiness","single","在城市仿真中，居民满意度（幸福度）通常不作为以下哪一项的直接决定因素？",["人口迁入与迁出","消费意愿","企业是否扩大产能","对公共服务的评价"],[2],"满意度直接驱动人口迁移、消费与对公共服务的评价；企业扩产主要取决于利润、产能利用率与景气预期，与居民满意度只是间接相关。","中级经济师·经济基础知识·第六章"],["laborSupply","single","关于个人劳动供给曲线的形状，正确的说法是：",["一定向右上方倾斜","工资上升到一定程度后可能向后弯曲","与工资完全无关","一定向右下方倾斜"],[1],"工资上升有替代效应（多工作）和收入效应（多闲暇）。工资较低时替代效应占优，曲线右上方倾斜；工资高到一定程度后收入效应占优，曲线向后弯曲。","中级经济师·经济基础知识·第二章 消费者行为分析"],["savingsRate","single","一个经济体把储蓄率长期维持在很高水平，短期内最可能出现：",["消费与总需求受抑，产出增速放缓","消费与总需求同步大幅上升","物价立即大幅上涨","失业率立即降为零"],[0],"储蓄是收入的漏出。储蓄率过高会压低当期消费与总需求，在需求约束下产出增速放缓；长期看储蓄转化为投资又会提高潜在产出，这是短期与长期的经典权衡。","中级经济师·经济基础知识·第五章"],["consumptionPropensity","single","某家庭新增可支配收入 1000 元，其中用于消费 800 元。其边际消费倾向（MPC）与边际储蓄倾向（MPS）分别为：",["0.8 与 0.2","0.2 与 0.8","0.8 与 1.25","1.25 与 0.8"],[0],"MPC = ΔC/ΔY = 800/1000 = 0.8；MPS = 1 − MPC = 0.2，二者之和恒等于 1。","中级经济师·经济基础知识·第五章 简单国民收入决定"],["laborParticipation","single","劳动力参与率的计算公式是：",["就业人口 ÷ 劳动年龄人口","劳动力人口 ÷ 劳动年龄人口","失业人口 ÷ 劳动力人口","就业人口 ÷ 总人口"],[1],"劳动力参与率 =（就业人口+失业人口）÷ 劳动年龄人口，衡量有多少人「进入」劳动力市场；失业率的分母才是劳动力人口。","中级经济师·经济基础知识·第六章"],["skillInvest","single","家庭增加教育培训投入，在经济学上主要被归类为：",["消费支出","人力资本投资","转移支付","存货投资"],[1],"教育培训能提升未来生产率与收入，属于人力资本投资；它与物质资本投资一样具有当期付出、未来收益的特征。","中级经济师·经济基础知识·第三章 生产和成本理论"],["riskAppetite","single","风险偏好较高的家庭，在收入不变时通常表现为：",["储蓄率更高、消费更保守","更愿意动用储蓄进行当期消费","完全不持有任何储蓄","消费与储蓄都不变"],[1],"风险偏好高意味着更看重当期效用、更愿意承担未来不确定性，因此更倾向于动用储蓄消费；风险厌恶者则相反，会持有更厚的预防性储蓄。","中级经济师·经济基础知识·第二章"],["humanCapital","single","下列属于人力资本的是：",["工厂的机器设备","劳动者通过培训掌握的技能","企业持有的现金","已建成的高速公路"],[1],"人力资本是凝结在劳动者身上的知识、技能与健康；机器设备与基础设施属于物质资本，现金属于金融资产。","中级经济师·经济基础知识·第三章"],["budgetConstraint","single","在只有两种商品、收入与价格既定的情况下，消费者预算线的斜率绝对值等于：",["两种商品的边际替代率","两种商品的价格之比","两种商品的效用之比","消费者的收入水平"],[1],"预算线斜率绝对值 = P₁/P₂。消费者效用最大化的均衡条件是边际替代率 MRS 等于该价格比。","中级经济师·经济基础知识·第二章"],["marginalUtility","single","消费者实现效用最大化的均衡条件是：",["两种商品的边际效用相等","两种商品的总效用相等","边际替代率等于两种商品的价格之比","边际效用为零"],[2],"均衡条件为 MRS₁₂ = P₁/P₂，等价于 MU₁/P₁ = MU₂/P₂——即每一元钱花在两种商品上带来的边际效用相等，而非边际效用本身相等。","中级经济师·经济基础知识·第二章"],["diminishingReturns","single","边际报酬递减规律成立的前提条件是：",["所有生产要素同比例增加","其他生产要素投入不变，只增加某一种要素","技术水平持续进步","生产规模不断缩小"],[1],"边际报酬递减指的是在技术水平和其他要素投入不变时，连续等量增加某一种要素，其带来的产量增量终将递减。它与规模报酬是不同层面的问题。","中级经济师·经济基础知识·第三章"],["elasticity","single","某商品价格上涨 10% 导致需求量下降 15%，其需求价格弹性系数与总收益变化为：",["1.5，总收益增加","1.5，总收益减少","0.67，总收益增加","0.67，总收益减少"],[1],"Ed = 15%/10% = 1.5 > 1，属富有弹性。富有弹性时涨价会使总收益减少，降价才会增加总收益。","中级经济师·经济基础知识·第一章"],["substitutionEffect","single","某种商品价格上升后，消费者转而购买更多其替代品，这一现象称为：",["收入效应","替代效应","棘轮效应","示范效应"],[1],"替代效应指相对价格变化导致消费者用相对便宜的商品替代变贵的商品；收入效应则是价格变化改变了实际购买力所引起的数量调整。","中级经济师·经济基础知识·第二章"],["equilibriumPrice","single","某商品市场价格高于均衡价格时，市场会出现：",["供不应求，价格趋于上升","供过于求，价格趋于下降","供需相等，价格不变","供给曲线左移"],[1],"高于均衡价格时供给量大于需求量，出现过剩，卖方竞争导致价格回落，市场自发向均衡收敛——这正是「看不见的手」的作用机制。","中级经济师·经济基础知识·第一章"],["consumerSurplus","single","消费者剩余是指：",["消费者实际支付的价格","消费者愿意支付的最高价格与实际支付价格之差","生产者获得利润","市场价格与生产成本之差"],[1],"消费者剩余 = 支付意愿 − 实际支付，衡量消费者从交易中获得的净福利；对应的生产者剩余则是价格与边际成本之差。","中级经济师·经济基础知识·第一章"],["producerSurplus","single","在完全竞争市场长期均衡时，生产者剩余在数值上等于：",["零","经济利润","固定成本","总收益"],[1],"长期均衡时价格等于边际成本也等于平均成本最低点，经济利润为零；短期中生产者剩余表现为价格超过边际成本的部分，即经济利润。","中级经济师·经济基础知识·第四章 市场结构理论"],["sunkCost","single","关于沉没成本，理性决策者应当：",["在决策时充分考虑已发生的沉没成本","在决策时不考虑沉没成本，只比较边际收益与边际成本","把沉没成本计入固定成本分摊","只有在亏损时才考虑沉没成本"],[1],"沉没成本是已经发生且无法收回的支出，与当前决策无关。理性决策只对未来的边际收益与边际成本作比较，俗话即「不要为打翻的牛奶哭泣」。","中级经济师·经济基础知识·第三章"],["comparativeAdvantage","single","甲国生产 1 单位粮食需 4 小时、1 单位布需 8 小时；乙国分别需 6 小时和 6 小时。按比较优势理论：",["甲国应出口粮食，乙国应出口布","甲国应出口布，乙国应出口粮食","两国不会发生贸易","甲国两种产品都出口"],[0],"甲国粮食机会成本 0.5 单位布（4/8），乙国为 1 单位布（6/6），甲国在粮食上有比较优势；乙国布的机会成本 1 单位粮，低于甲的 2，故出口布。","中级经济师·经济基础知识·第十章 国际贸易理论与政策"],["wealth","single","下列属于家庭「存量」概念的是：",["月工资收入","家庭持有的存款余额","本月消费支出","本月缴纳的税额"],[1],"存量是某一时点上的数量（存款余额、房产、负债），流量是某一时期内的数量（收入、消费、纳税）。收入是流量，财富是存量。","中级经济师·经济基础知识·第五章"],["resilience","single","家庭抗风险缓冲能力最直接体现在：",["月收入的高低","持有流动性资产能覆盖几个月的基本开支","技能水平","是否拥有房产"],[1],"抗风险能力取决于「流动性储备 ÷ 必要开支」的倍数关系，而不是收入绝对值。高收入但高负债、无储蓄的家庭同样脆弱。","中级经济师·经济基础知识·第五章"],["minWage","single","关于最低工资标准的经济影响，说法正确的是：",["一定会降低所有劳动者的福利","在买方垄断的劳动力市场上，适度提高最低工资可能同时提高工资与就业","对就业没有任何影响","只会影响高收入群体"],[1],"在竞争性市场上高于均衡的最低工资会减少就业；但在买方垄断（企业有工资决定权）的市场中，适度的最低工资可以同时提高工资与就业量，这是劳动力市场买方垄断模型的经典结论。","中级经济师·经济基础知识·第六章"],["markup","single","企业在成本之上按一定比例加成定价，这种做法主要出现在：",["完全竞争市场","具有市场势力的不完全竞争市场","任何市场都无法实现","只有在政府对价格管制时"],[1],"完全竞争厂商是价格接受者，只能按 P=MC 定价；加成定价（P = 成本 ×(1+加成率)）意味着企业拥有一定的定价权，属于不完全竞争市场的行为。","中级经济师·经济基础知识·第四章"],["wageMultiplier","single","企业把工资出价提高到高于同行的水平（效率工资），其经济动机通常是：",["纯粹增加成本，没有任何收益","降低离职率、提高劳动效率与产出质量","降低产品价格","减少税收"],[1],"效率工资理论认为，高于市场出清水平的工资能降低怠工与流失、提高生产率，从而使单位劳动成本反而下降。","中级经济师·经济基础知识·第六章"],["expansion","single","企业决定扩大产能时，最应优先考虑的约束条件是：",["只要盈利就应该无限扩产","预期需求能否持续消化新增产能","厂房面积是否最大","竞争对手是否也在扩产"],[1],"扩产决策的核心是预期需求的持续性。若需求仅仅是周期性的短期繁荣，扩产会在需求回落时形成过剩产能与沉淀成本，这正是「加速原理」导致波动放大的原因。","中级经济师·经济基础知识·第三章"],["rdInvest","single","从长期看，研发投入对一个企业最直接的作用是：",["立刻降低当期成本","提升全要素生产率，使同样投入产出更多","必然提高产品售价","减少税收负担"],[1],"研发通过技术进步与工艺改进提高全要素生产率（TFP），使相同要素投入产生更多产出，是长期增长的根本来源，但短期表现为当期成本增加。","中级经济师·经济基础知识·第三章 / 第六章"],["inventoryStrategy","single","企业主动增加库存缓冲，在经济上行期与下行期分别会：",["上行期加剧短缺，下行期缓解衰退","上行期放大繁荣，下行期加深衰退","对周期没有任何影响","总是平滑经济波动"],[1],"存货投资的顺周期性是「基钦周期」（约 40 个月）的成因：景气时企业乐观备货推高产出，衰退时被迫清库存进一步压低产出，因此高库存策略会放大波动。","中级经济师·经济基础知识·第七章 经济周期"],["avgProfit","single","在国民经济核算中，企业利润总额与下列哪一项的关系最直接？",["等于总产出减中间投入","等于收入减去成本后的余额，是营业盈余的组成部分","等于总营收","等于固定资产折旧"],[1],"收入法 GDP 由劳动者报酬、生产税净额、固定资产折旧和营业盈余构成，企业利润是营业盈余的核心部分，而非总产出本身。","中级经济师·经济基础知识·第五章"],["capacityUtil","single","产能利用率持续偏低通常预示着：",["经济过热，应立即加息","资源闲置，存在产出负缺口，物价承压","企业应当立即大幅扩产","劳动力市场供不应求"],[1],"产能利用率低意味着资源闲置、实际产出低于潜在产出（负产出缺口），通缩压力大于通胀压力；此时扩产反而加剧过剩。","中级经济师·经济基础知识·第七章"],["avgPrice","single","用「简单算术平均」计算多企业产品的平均价格，最主要的缺陷是：",["计算过于复杂","没有考虑不同产品的产量或销售额权重","只能用于服务业","会低估通货膨胀"],[1],"价格指数应按销售额或产量加权（如拉氏指数、帕氏指数）。简单算术平均会让小众高价商品过度影响结果，不能反映真实的物价水平变化。","中级经济师·经济基础知识·第五章"],["totalRevenue","single","企业总收益等于：",["利润加固定成本","产品价格乘以销售数量","产品价格乘以产量","销售额减去成本"],[1],"总收益 = 价格 × 实际销售数量。注意「乘以产量」只在产销平衡时成立，未售出的产出形成存货而非收益。","中级经济师·经济基础知识·第三章"],["inventory","single","在国民经济核算的支出法中，企业存货的增加应当：",["不计入任何项目","计入存货投资（属于投资的一部分）","计入消费","计入政府支出"],[1],"支出法 GDP = C + I + G + (X−M)，其中的 I 包括固定资产投资与存货投资。企业未售出而增加的存货被视为企业「自己买下了」，计入投资。","中级经济师·经济基础知识·第五章"],["marginalCost","single","企业利润最大化的产量决策应满足：",["边际收益等于边际成本","边际收益大于边际成本越多越好","平均成本最低","总成本最小"],[0],"通用法则为 MR = MC。在完全竞争下 MR=P，故等价于 P=MC；平均成本最低点对应的是生产效率而非利润最大化产量。","中级经济师·经济基础知识·第三章"],["fixedCost","single","在短期生产中，固定成本的特点是：",["随产量增加而增加","不随产量变化，即使产量为零也必须支付","只存在于制造业","长期中也保持不变"],[1],"短期内固定成本（厂房、设备折旧等）与产量无关；但长期中一切成本都是可变的，不存在长期固定成本。","中级经济师·经济基础知识·第三章"],["productivity","single","劳动生产率提高在宏观层面的直接表现是：",["单位劳动投入创造更多产出","就业人数必然增加","工资必然下降","物价必然上升"],[0],"劳动生产率 = 产出 ÷ 劳动投入。它是长期生活水平提高的根本来源；但短期内若需求跟不上，生产率提高也可能伴随结构性失业。","中级经济师·经济基础知识·第六章"],["economiesOfScale","single","规模经济指的是：",["企业数量增加导致成本下降","企业自身产量扩大导致长期平均成本下降","城市人口增加导致物价下降","政府补贴导致成本下降"],[1],"规模经济（内部）是单个企业产量扩大引发长期平均成本下降；企业聚集带来的成本下降属于「集聚经济」（外部规模经济），二者主体不同。","中级经济师·经济基础知识·第三章"],["entryExit","single","在完全竞争市场的长期调整中，企业自由进入与退出的结果是：",["所有企业获得正的经济利润","经济利润趋于零，价格等于平均成本最低点","价格持续上涨","市场集中度不断提高"],[1],"有正利润则新企业进入、供给增加、价格下降；有亏损则企业退出。长期均衡时经济利润为零，P = MC = AC 最低点。","中级经济师·经济基础知识·第四章"],["pollution","single","某工厂排放污染使下游居民健康受损却无需赔偿，这在经济学上属于：",["正外部性","负外部性","公共物品问题","信息不对称"],[1],"负外部性指经济主体的行为给他人带来未计入市场交易的成本。矫正手段包括庇古税、排污权交易、明晰产权（科斯定理）等。","中级经济师·经济基础知识·第八章 市场失灵与政府干预"],["externality","single","矫正负外部性的「庇古税」指的是：",["对污染企业发放补贴","按边际外部成本对污染者征税，使外部成本内部化","禁止一切工业生产","由居民自行承担污染"],[1],"庇古税把污染的边际外部成本内部化为企业私人成本，使其产量达到社会最优水平。与之相对，科斯方案强调明晰产权下的私人谈判。","中级经济师·经济基础知识·第八章"],["landValue","single","城市中心区地价远高于郊区，最根本的原因是：",["中心区土地质量更好","区位稀缺性与可达性带来的级差地租","政府强制规定","中心区建筑成本更高"],[1],"地价由区位决定的级差地租驱动：可达性越高、集聚收益越大的地块，使用者愿意支付的地租越高，形成由中心向外递减的地价梯度。","中级经济师·经济基础知识·第三章 / 第八章"],["density","single","城市开发密度提高可能带来的双重效应是：",["只提高集聚收益，没有代价","集聚收益上升，但拥堵、污染等规模不经济也随之上升","只增加污染","对经济没有任何影响"],[1],"密度提高带来劳动力池共享、知识溢出与基础设施规模经济；同时带来拥堵、噪音、污染与生活成本上升，城市最优规模取决于两种力量的平衡。","中级经济师·经济基础知识·第八章"],["amenity","single","学校、医院、供水等公共服务设施属于：",["纯粹的私人物品","具有外部收益的准公共物品","俱乐部物品中的纯私人部分","只由市场自发提供"],[1],"公共服务具有非排他性或正外部性，私人供给会低于社会最优水平，因此通常由政府提供或补贴；完全非竞争非排他的才是纯公共物品。","中级经济师·经济基础知识·第八章"],["landUse","single","在城市规划中把工业用地布置在城市主导风向的下风向，主要是为了：",["降低运输成本","减少工业污染对居住区的影响","提高地价","便于企业扩张"],[1],"工业布局需考虑风向（下风向）、水流（下游）与地形，把污染型用地放在主导风向的下风向与河流下游，是控制负外部性空间扩散的常规手段。","中级经济师·经济基础知识·第八章"],["congestion","single","城市规模扩大带来的拥堵成本，本质上属于：",["企业的内部成本","个体行为施加给他人的负外部性","政府财政支出","家庭储蓄的漏出"],[1],"每个新增出行者都会降低他人通行速度，却不会为此付费，这是典型的负外部性。拥堵费、限行等政策正是为了内部化这一成本。","中级经济师·经济基础知识·第八章"],["industrySubsidy","single","政府向特定产业发放补贴，长期看最需要警惕的风险是：",["补贴一定会导致企业立即倒闭","形成过剩产能与对补贴的依赖，降低资源配置效率","补贴会使物价必然下降","补贴对财政没有影响"],[1],"补贴扭曲相对价格，可能保护低效企业、诱发产能过剩与寻租，退出时还会引发就业与债务问题；因此补贴通常需要设定期限与绩效条件。","中级经济师·经济基础知识·第八章 / 第九章 财政"],["marketStructure","single","下列市场结构中，企业进入壁垒最高的是：",["完全竞争","垄断竞争","寡头垄断","完全垄断"],[3],"完全垄断由单一厂商构成且无相近替代品，进入壁垒最高（法定、规模、技术或要素控制）；寡头次之，垄断竞争较低，完全竞争不存在壁垒。","中级经济师·经济基础知识·第四章"],["monopolisticCompetition","single","垄断竞争市场的长期均衡特征是：",["价格等于边际成本，经济利润为零","价格高于边际成本，经济利润为零","价格高于边际成本且存在正经济利润","价格等于平均可变成本"],[1],"垄断竞争厂商因产品差异而向下倾斜的需求曲线，均衡时 P > MC（存在过剩能力）；但自由进入使长期经济利润趋于零。","中级经济师·经济基础知识·第四章"],["supplyChain","single","产业链上下游企业集聚布局，主要获得的好处是：",["完全消除市场风险","降低交易成本与运输成本，加快信息与技术扩散","必然形成垄断","使税收自动增加"],[1],"产业链集聚降低了中间投入的运输与协调成本，促进了面对面交流与知识溢出，是区域竞争力的主要来源；但它不消除需求风险。","中级经济师·经济基础知识·第三章 / 第八章"],["tradeOpenness","single","提高贸易开放度对一个城市经济的典型影响是：",["扩大市场与需求，同时更易受外部冲击传导","只带来好处、没有任何风险","必然导致产业空心化","使物价完全不受外部影响"],[0],"开放度提高既扩大了销路与要素来源，也把外部周期与价格波动传导进来，是一把「放大器」：收益与波动同时变大。","中级经济师·经济基础知识·第十章"],["agglomeration","single","集聚效应指的是：",["企业合并成为一家大公司","经济活动在空间上集中所产生的额外效率","人口均匀分散分布","政府集中配置资源"],[1],"集聚效应（外部规模经济）来自劳动力池共享、中间投入共享与知识溢出三类机制，是城市存在与扩张的根本经济性原因。","中级经济师·经济基础知识·第三章"],["cluster","single","与一般集聚相比，「产业集群」更强调：",["企业数量多","同一产业及相关机构在地理上集中并形成分工协作网络","城市人口规模大","政府主导的园区建设"],[1],"产业集群强调相关企业、供应商、服务机构与高校在空间上形成网络化的分工协作，而非仅仅是企业在同一地点堆砌。","中级经济师·经济基础知识·第三章"],["gentrification","single","城市更新中出现的「士绅化」通常指：",["城市人口整体减少","高收入群体迁入导致地价房价上涨、原低收入居民被迫外迁","工业向郊区迁移","公共设施全面衰退"],[1],"士绅化（绅士化）是中心城区改造升级后地租上升、原居民被置换的现象，它提高了空间效率，但也可能带来居住隔离与分配问题。","中级经济师·经济基础知识·第八章"],["gdp","single","下列关于 GDP 的说法，正确的是：",["GDP 是一国（或地区）所有常住单位在一定时期内生产的最终产品和服务的价值总和","GDP 包括全部中间产品的价值","家庭主妇的家务劳动计入 GDP","股票买卖的成交额全额计入 GDP"],[0],"GDP 核算最终产品与服务以避免重复计算；家务劳动、地下经济不计入；股票买卖只是资产转移，不计入 GDP（仅佣金计入）。","中级经济师·经济基础知识·第五章"],["cpi","single","CPI 持续上升、但上升速度逐步放缓，这种情况通常被称为：",["通货紧缩","通货膨胀率下降但仍在通胀","恶性通货膨胀","滞胀"],[1],"物价水平上升速度放缓属于「通胀率回落」（disinflation），物价仍在涨；物价水平绝对下降才是通货紧缩（deflation）。","中级经济师·经济基础知识·第七章"],["migration","single","人口从农村流向城市的根本经济动因通常是：",["城市气候更好","城乡预期收入差距与就业机会差异","农村土地质量下降","政府强制搬迁"],[1],"托达罗模型指出，迁移决策取决于城乡预期收入差距（城市工资 × 就业概率）与迁移成本的比较，而非单纯的工资差距。","中级经济师·经济基础知识·第六章"],["consumption","single","凯恩斯的绝对收入假说认为，消费主要取决于：",["当期绝对收入水平","一生的永久收入","过去的最高收入","利率水平"],[0],"凯恩斯认为消费随当期可支配收入增加而增加，但增量递减（边际消费倾向递减）。弗里德曼的永久收入假说与莫迪利安尼的生命周期假说才是跨期视角。","中级经济师·经济基础知识·第五章"],["investment","single","在简单凯恩斯模型中，投资乘数的大小取决于：",["边际消费倾向，MPC 越大乘数越大","政府税收的固定数额","人口增长率","汇率水平"],[0],"投资乘数 k = 1/(1−MPC) = 1/MPS。边际消费倾向越高，每一轮支出中漏出为储蓄的比例越小，累积放大效应越强。","中级经济师·经济基础知识·第五章"],["inflation","single","由工资、原材料等生产成本普遍上升推动的通货膨胀属于：",["需求拉上型通胀","成本推动型通胀","结构性通胀","输入型通胀"],[1],"成本推动型通胀源于供给侧的工资与原材料成本上升，其典型后果是产出下降与物价上升并存，即「滞胀」，这是它与需求拉上型通胀的关键区别。","中级经济师·经济基础知识·第七章"],["deflation","single","通货紧缩最典型的危害是：",["物价便宜，消费者普遍受益","债务人负担加重、需求推迟，形成「债务—通缩」螺旋","企业利润必然大幅上升","政府税收必然增加"],[1],"通缩使实际债务负担加重、消费者推迟购买、企业利润下滑并裁员，形成费雪所说的债务—通缩螺旋，危害往往甚于温和通胀。","中级经济师·经济基础知识·第七章"],["realWage","single","名义工资上涨 5%，同期 CPI 上涨 8%，则实际工资：",["上涨 3%","下降约 2.8%","上涨 13%","保持不变"],[1],"实际工资 ≈ 名义工资 ÷ 物价指数。(1.05/1.08) − 1 ≈ −2.78%，即实际购买力下降约 2.8%。判断生活水平必须剔除物价。","中级经济师·经济基础知识·第七章"],["urbanization","single","衡量城市化水平最常用的指标是：",["城市建成区面积","城镇人口占总人口的比重","城市 GDP 总量","城市数量"],[1],"城市化率 = 城镇常住人口 ÷ 总人口，是人口意义上的城市化指标；建成区面积与灯光强度等只是辅助的空间度量。","中级经济师·经济基础知识·第六章"],["gini","single","关于基尼系数，正确的说法是：",["取值在 0 到 1 之间，数值越大分配越不均","取值在 0 到 100 之间，数值越大分配越平均","数值越小分配越不均","与收入分配无关"],[0],"基尼系数介于 0（完全平均）与 1（完全不均）之间，国际上通常把 0.4 作为收入分配差距的警戒线。","中级经济师·经济基础知识·第九章"],["treasury","single","政府财政出现赤字时，最基本的弥补方式是：",["发行国债","直接增发货币","提高最低工资","降低物价"],[0],"弥补赤字的常规手段是发行国债（借债）；我国预算法规定地方财政不得赤字，中央赤字通过国债弥补，中央银行不得直接透支。","中级经济师·经济基础知识·第九章 财政"],["taxRate","single","在其他条件不变时，提高税率对税基的典型影响是：",["税基完全不受影响","税率过高会抑制经济活动，导致税基缩小","税基必然扩大","税基先缩小后消失"],[1],"拉弗曲线刻画了税率与税收收入的倒 U 型关系：税率超过某一点后，抑制劳动与投资的负效应超过增收效应，税收收入反而下降。","中级经济师·经济基础知识·第九章"],["publicSpend","single","政府增加公共支出以拉动经济，其效果受限于：",["乘数大小与是否存在挤出效应","只要支出就一定能等比例增加产出","人口规模","企业数量"],[0],"财政扩张的效果取决于支出乘数（与 MPC 相关）与挤出效应（政府借款抬高利率、挤占私人投资）；资源已充分利用时，扩张只会推高物价而非产出。","中级经济师·经济基础知识·第九章"],["welfare","single","政府提高失业救济与福利转移支付，对经济周期的作用是：",["自动稳定器：衰退时托住需求，繁荣时随支出减少而降温","只会加大经济波动","对经济周期没有任何作用","只在繁荣期发挥作用"],[0],"失业救济与累进税属于「内在稳定器」：衰退时领取人数自动增加、税负自动下降，从而缓冲可支配收入的下降，无需新的立法即可平抑波动。","中级经济师·经济基础知识·第九章"],["eduSubsidy","single","政府增加研发与人力资本补贴，最主要的收益体现在：",["当期财政余额立即改善","长期提高潜在产出与全要素生产率","当期物价立即下降","短期消费立即大幅增加"],[1],"研发与教育补贴在当期是财政支出，但通过人力资本积累与技术进步提高潜在产出，属于典型的「短期成本、长期收益」型政策。","中级经济师·经济基础知识·第六章 / 第九章"],["fiscal","multi","下列属于财政政策工具的有：",["税收","政府购买性支出","转移支付","法定存款准备金率"],[0,1,2],"税收、政府购买与转移支付是财政政策的三大工具；法定存款准备金率、再贴现率与公开市场业务属于货币政策工具，注意区分主管部门与工具类型。","中级经济师·经济基础知识·第九章"],["fiscalDeficit","single","财政赤字率通常指：",["财政赤字与 GDP 的比值","财政赤字与财政收入之比","债务余额与 GDP 之比","财政支出与财政收入之比"],[0],"赤字率 = 赤字额 ÷ GDP，国际常用 3% 作为参考警戒线；债务余额与 GDP 之比是「负债率」，二者口径不同。","中级经济师·经济基础知识·第九章"],["multiplier","single","若边际消费倾向为 0.75，政府增加 100 亿元购买支出，理论上可带动的国民收入增量约为：",["100 亿元","133 亿元","400 亿元","750 亿元"],[2],"政府购买乘数 = 1/(1−MPC) = 1/0.25 = 4，故 100 × 4 = 400 亿元。注意税收乘数为负且绝对值小于购买乘数。","中级经济师·经济基础知识·第五章"],["aggregateDemand","single","下列因素中，会使总需求曲线向右移动的是：",["物价水平下降","政府减税、企业投资意愿增强","生产成本上升","本币大幅升值抑制出口"],[1],"物价水平变化只引起沿总需求曲线的移动；减税、投资意愿增强、货币供给增加、出口改善等才会使整条 AD 曲线右移。","中级经济师·经济基础知识·第五章"],["aggregateSupply","single","长期总供给曲线呈垂直形状，其经济学含义是：",["价格不影响产出，长期产出由要素与技术决定","价格越高产出越多","长期中产出可以无限增长","长期中价格固定不变"],[0],"长期中价格与工资充分灵活，产出由劳动、资本、技术与制度决定的潜在产出水平决定，需求扩张只会推高价格、不改变长期产出。","中级经济师·经济基础知识·第五章"],["crowdingOut","single","「挤出效应」指的是：",["政府支出增加导致私人投资减少","政府支出增加导致物价下降","出口增加导致进口减少","消费增加导致储蓄减少"],[0],"政府扩大支出若通过借款融资，会抬高利率或占用资源，从而挤压私人投资，使扩张性财政的效果被部分抵消，故称「挤出」。","中级经济师·经济基础知识·第九章"],["naturalUnemployment","single","自然失业率是指：",["经济中完全没有失业时的失业率","充分就业状态下的摩擦性与结构性失业率之和","周期性失业的比率","政府规定的失业率上限"],[1], ，税收收入一定越多","存在某个税率水平，超过后提高税率反而使税收收入减少","税收与税率无关","税率为零时税收最多"],[1],"拉弗曲线呈倒 U 型：税率过低税收少，税率过高则抑制劳动与投资、缩小税基，税收收入反而下降。它强调的并非「减税总能增收」，而是税率存在临界点。","中级经济师·经济基础知识·第九章"],["stagflation","single","「滞胀」指的是：",["高通胀与高失业同时并存","低通胀与低失业并存","产出高速增长且物价稳定","物价下降且失业下降"],[0],"滞胀通常由成本推动型供给冲击（如能源价格暴涨）引起：总供给曲线左移导致物价上升与产出下降并存，使需求管理政策陷入两难。","中级经济师·经济基础知识·第七章"],["potentialOutput","single","潜在产出水平主要取决于：",["物价水平","劳动、资本、技术与制度等供给侧因素","政府当期的购买支出","消费者的信心"],[1],"潜在产出是资源充分利用时的产出上限，由要素投入数量、质量与全要素生产率决定。需求政策只能短期让实际产出偏离潜在产出，不能长期提高潜在产出本身。","中级经济师·经济基础知识·第六章"],["outputGap","single","当产出缺口为正（实际产出 > 潜在产出）时，最可能出现的局面是：",["资源过度利用，通胀压力上升","失业率大幅上升","物价持续下跌","企业成批倒闭"],[0],"正缺口意味着经济过热：产能与劳动力被过度使用，工资与物价上涨压力加大，通常伴随经常账户恶化，此时应采取紧缩性政策。","中级经济师·经济基础知识·第七章"]]</script>

<script>

function reqProgress(r, c) {

    case 'leverEver': { const v = r.op === '>=' ? c.leverMax[r.id] : c.leverMin[r.id];
      return v === undefined ? 0 : (r.op === '>=' ? k(v / (r.v || 1)) : 1); }
    case 'streak': return k((c.streak[r.id] || 0) / r.n);
    case 'round': return k(c.round / r.n);

    case 'phase': return c.cyclePhase === r.v ? 1 : 0;
    case 'gap': { const g = c.outputGap || 0;
      return r.cmp === '>=' || r.cmp === '>' ? k(Math.max(0, g) / Math.max(0.01, Math.abs(r.n))) : (g <= r.n ? 1 : k(Math.max(0, 1 - Math.abs(g) / Math.max(0.01, Math.abs(r.n))))); }

/* 玩家痕迹：拧过的旋钮极值 + 指标峰值/谷值 + 连续月数 */

const NUM_FIELDS = ['month','population','employmentRate','unemploymentRate','avgWage','cpi','gdp','treasury',

function tileAvg() {

// 个体层面的涌现量：预览页没有逐户/逐企业数据，用聚合量做等价近似，

  const cover = state.savings / Math.max(1, state.cons);

    // 会读出「失业率 14% 却有 43% 岗位空着」这种自相矛盾的数字。
    // 预览页没有逐企业的招聘台账，只能按劳动市场松紧反推；真实引擎是按 vacancy/capacity 直接统计的。

    gini: state.gini, happiness: state.happy, firms: state.firms,

const UNLOCK_GAP = 2;

const SEED_LIMIT = 8;
function seedUnlocks() {
  const c = buildCtx();

  for (const t of TERMS) {
    if (out.length >= SEED_LIMIT) break;
    if (state.unlocked.includes(t.key)) continue;
    if ((t.tier || 1) !== 1) continue;
    if (reqMet(t.req, c)) { state.unlocked.push(t.key); out.push(t); }
  }

/* ── 循环式玩法：个人 → 企业 → 政府 → 回到个人 ── */
const PHASE_ORDER = ['household', 'firm', 'gov'];
const PHASE_LABEL = { household:'个人视角', firm:'企业视角', gov:'政府视角' };
const SWITCH_NEW = 10, SWITCH_ROUND = 14;
function cycleProgress() {
  const c = state.cycle;
  const avail = PHASE_ORDER.filter(p => unlockedPersp().includes(p));
  const unvisited = avail.filter(p => !c.visited.includes(p));
  return {
    round: c.round, roundsPlanned: c.roundsPlanned, phase: c.phase, phaseMonths: c.phaseMonths,
    needMonths: Math.max(0, (unvisited.length ? SWITCH_NEW : SWITCH_ROUND) - c.phaseMonths),
    finished: c.round >= c.roundsPlanned && unvisited.length === 0
  };
}
// 兜底：慢节奏蓝图可能很久长不到中等城市，政府视角迟迟不解锁。
// 本轮已走过两个视角且累计够久，就允许进入下一轮，不让玩家永远停在第一轮。
const ROUND_FALLBACK = 60;
function tickCycle() {
  const c = state.cycle;
  c.phaseMonths += 1;
  if (typeof c.roundMonths !== 'number') c.roundMonths = 0;
  c.roundMonths += 1;
  const avail = PHASE_ORDER.filter(p => unlockedPersp().includes(p));
  if (!avail.length) return null;
  const allUnlocked = avail.length === PHASE_ORDER.length;
  const unvisited = avail.filter(p => !c.visited.includes(p));
  if (c.phaseMonths < (unvisited.length ? SWITCH_NEW : SWITCH_ROUND)) return null;
  if (unvisited.length) {
    c.phase = unvisited[0]; c.phaseMonths = 0;
    if (!c.visited.includes(c.phase)) c.visited.push(c.phase);
    return { kind:'phase', phase:c.phase, round:c.round };

  const canAdvance = allUnlocked || (avail.length >= 2 && c.roundMonths >= ROUND_FALLBACK);
  if (!canAdvance) { c.phase = avail[0]; c.phaseMonths = 0; c.visited = [avail[0]]; return null; }
  if (c.round >= c.roundsPlanned) { c.phaseMonths = 0; return null; }
  c.round += 1; c.visited = [avail[0]]; c.phase = avail[0]; c.phaseMonths = 0; c.roundMonths = 0;

/* ── 经济周期引擎 ──
   指标不再是单调爬升的直线：景气由「内生存货周期 + 外生冲击 + 政策调制」三者合成，
   而政策的每一根旋钮都会改写波幅、波长与谷底深度——所以周期是玩家自己造出来的。 */
let bcDirty = false;   // 本月是否换过阶段（用于播报）
// 旧存档兼容：缺字段补默认值，不让读档后周期直接失效
function normalizeBC(c) {

  if (typeof c.prevIndex !== 'number') c.prevIndex = c.index;
  if (typeof c.amplitude !== 'number') c.amplitude = d.amplitude;
  if (typeof c.period !== 'number') c.period = d.period;
  if (typeof c.t !== 'number') c.t = 0;
  if (typeof c.shock !== 'number') c.shock = 0;
  if (typeof c.demandMult !== 'number') c.demandMult = 1;
  if (typeof c.investMult !== 'number') c.investMult = 1;
  if (typeof c.potentialOutput !== 'number') c.potentialOutput = 0;
  if (typeof c.outputGap !== 'number') c.outputGap = 0;
  if (typeof c.cycleCount !== 'number') c.cycleCount = 0;
  if (typeof c.trend !== 'number') c.trend = 0;
  if (typeof c.trendPerHead !== 'number') c.trendPerHead = 0;
  if (!Array.isArray(c.history)) c.history = [];
  if (!Array.isArray(c.gapHistory)) c.gapHistory = [];

}
function initBC() {
  return { phase:'recovery', phaseMonths:0, phaseCount:{ boom:0, recession:0, depression:0, recovery:0 },
    index:0.1, prevIndex:0, amplitude:0.34, period:46, t:0, shock:0,
    demandMult:1, investMult:1, confidence:0,
    potentialOutput:0, outputGap:0, peakIndex:0.1, troughIndex:0,
    cycleCount:0, trend:0, trendPerHead:0, history:[], gapHistory:[] };

const bcClamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function bcShape() {
  const amplifiers = gov.industrySubsidy * 0.34 + fp.expansion * 0.24 + fp.inventoryStrategy * 0.22 + gov.tradeOpenness * 0.3;
  const stabilizers = gov.welfare * 0.3 + gov.publicSpend * 0.18 + gov.taxRate * 0.5;
  const amplitude = bcClamp(0.22 + amplifiers - stabilizers, 0.1, 0.95);
  const period = bcClamp(44 + gov.eduSubsidy * 16 + fp.rdInvest * 10 - fp.inventoryStrategy * 10 - gov.industrySubsidy * 8, 28, 76);
  const trendK = bcClamp(0.0022 + gov.eduSubsidy * 0.0032 + hp.skillInvest * 0.0018 + fp.rdInvest * 0.0026
    - gov.taxRate * 0.0035 - gov.industrySubsidy * 0.0012, 0.0004, 0.008);
  return { amplitude, period, trendK,
    stabilizer: bcClamp(gov.welfare * 0.7 + gov.publicSpend * 0.4 + gov.taxRate * 0.6, 0, 1),
    accelerator: bcClamp(0.55 + fp.expansion * 0.9 + gov.industrySubsidy * 0.5, 0.4, 2.2) };
}
function stepBC() {
  const c = state.business || (state.business = initBC());
  const s = bcShape();
  // ① 外生冲击：AR(1)，持续性够强才形成「一波」而不是噪声
  const sigma = 0.055 * (1 + gov.tradeOpenness * 1.4 + s.amplitude);
  c.shock = bcClamp(0.86 * c.shock + sigma * ((rnd() + rnd() + rnd() - 1.5) * 1.4), -0.7, 0.7);
  // 偶发大冲击：贸易越开放，越容易被外部波及
  if (rnd() < 0.012 + gov.tradeOpenness * 0.02) {
    const mag = (0.35 + rnd() * 0.45) * (rnd() < 0.5 ? -1 : 1);
    c.shock = bcClamp(c.shock + mag, -0.85, 0.85);
    c.jump = { month: state.t, mag };
  }
  // ② 内生存货周期
  c.t += 1; if (c.t > s.period) c.t -= s.period;
  const wave = Math.sin(2 * Math.PI * c.t / s.period);
  c.amplitude = s.amplitude; c.period = s.period;
  // ③ 合成景气指数，自动稳定器削平谷底
  c.prevIndex = c.index;
  let idx = wave * s.amplitude + c.shock;
  if (idx < 0) idx *= 1 - s.stabilizer * 0.45;
  c.index = bcClamp(idx, -1, 1);
  c.peakIndex = Math.max(c.peakIndex, c.index);
  c.troughIndex = Math.min(c.troughIndex, c.index);
  c.demandMult = Math.max(0.35, 1 + c.index * 0.26);
  c.investMult = Math.max(0.05, 1 + c.index * 0.62 * s.accelerator);
  c.confidence = c.index;
  // ④ 阶段判定：看水位也看方向，带最短持续期避免闪烁
  const slope = c.index - c.prevIndex;
  let next = c.phase;
  if (c.index >= 0.34) next = 'boom';
  else if (c.index <= -0.34) next = 'depression';
  else if (slope >= 0.004) next = 'recovery';
  else if (slope <= -0.004) next = 'recession';
  if (next !== c.phase && (c.phaseMonths >= 4 || next === 'boom' || next === 'depression')) {
    if (c.phase === 'depression' && next === 'recovery') c.cycleCount += 1;
    c.phase = next; c.phaseMonths = 0; c.phaseCount[next] += 1;
    bcDirty = true;
  }
  c.phaseMonths += 1;
  c.history.push(c.index); c.gapHistory.push(c.outputGap);
  if (c.history.length > 600) c.history.shift();
  if (c.gapHistory.length > 600) c.gapHistory.shift();
  return c;
}
// 人均口径的产出缺口：用总量算会被人口增长污染成恒正
function updateGap(actual) {
  const c = state.business || (state.business = initBC());
  const s = bcShape();
  if (!Number.isFinite(actual) || actual <= 0) return;
  const pop = Math.max(1, state.pop);
  const perHead = actual / pop;
  if (c.trendPerHead <= 0) { c.trendPerHead = perHead; c.trend = actual; c.potentialOutput = actual; c.outputGap = 0; return; }
  const k = 0.05;
  c.trendPerHead = c.trendPerHead * (1 + s.trendK) * (1 - k) + perHead * k;
  c.outputGap = bcClamp((perHead - c.trendPerHead) / Math.max(0.01, c.trendPerHead), -0.6, 0.6);
  c.potentialOutput = c.trendPerHead * pop; c.trend = c.potentialOutput;
}
// 把周期叠加到政策基准上：就业、物价、利润、产能一起随景气摆动
function applyCycle() {
  const b = state.base, c = state.business || initBC();
  const idx = c.index || 0, gap = c.outputGap || 0;
  state.wage = b.wage * (1 + idx * 0.05);
  state.cons = b.cons * (1 + idx * 0.06);
  state.emp = bcClamp(b.emp + idx * 0.06 + gap * 0.04, 0.5, 0.995);
  state.firmProfit = b.profit * (1 + idx * 0.55) + gap * b.rev * 0.10;
  state.util = bcClamp(b.util + idx * 0.22, 0.15, 1);
  state.price = b.price * (1 + idx * 0.04 + gap * 0.18);
  state.cpiBase = bcClamp(b.cpi * (1 + idx * 0.025 + gap * 0.22), 60, 220);
  state.rev = state.price * QTY_PER_FIRM * state.util;
  state.gini = bcClamp(0.30 + (1 - state.emp) * 0.6, 0.05, 0.9);
}

/* ═══════════════ 2b. 闯关问答：积分 · 连对 · 奖杯 ═══════════════

  const t = termByKey(key), q = quizByKey(key);
  if (!t) return;
  if (!q) {
    showModal(`<div class="chapter">${CH_LABEL[t.chapter]}</div><h2>${t.name}</h2>
      <h4>基本定义</h4><p>${t.def}</p><h4>在城里怎么体现</h4><p>${t.effect}</p>
      <button class="close" data-close>知道了</button>`);
    if (onDone) onDone(true);
    return;
  }
  const multi = q.type === 'multi';
  const chosen = new Set();
  const score = quizScoreOf(q);
  const already = state.quiz.answered[key];
  showModal(`<div class="chapter">${CH_LABEL[t.chapter]} · ${TYPE_LABEL[q.type]} · ${score} 分</div>
    <h2>📖 ${t.name}</h2>
    <h4>基本定义</h4><p>${t.def}</p>
    <h4>在城里怎么体现</h4><p>${t.effect}</p>
    <div class="quiz-box">
      <div class="quiz-stem">${q.stem}</div>
      <div class="quiz-opts">${q.options.map((o, i) =>
        `<button class="quiz-opt" data-i="${i}"><span class="qo-key">${'ABCDE'[i]}</span>${o}</button>`).join('')}</div>
      <div class="quiz-tip">${multi ? '多选题：少选、多选、错选均不得分' : '请选择唯一正确答案'}${
        already ? `　·　此前已作答 ${already.tries} 次` : '　·　首次答对额外 +5 分'}</div>
      <div class="quiz-actions">
        <button class="quiz-submit" id="quiz-submit" disabled>提交</button>
        <button class="quiz-skip" id="quiz-skip">先跳过</button>
      </div>
      <div class="quiz-feedback hidden" id="quiz-fb"></div>
    </div>`);
  const opts = Array.prototype.slice.call(modal.querySelectorAll('.quiz-opt'));
  const submit = modal.querySelector('#quiz-submit');
  const skip = modal.querySelector('#quiz-skip');
  const fb = modal.querySelector('#quiz-fb');
  const sync = () => { opts.forEach(b => b.classList.toggle('on', chosen.has(Number(b.dataset.i)))); submit.disabled = chosen.size === 0; };
  opts.forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i);
    if (chosen.has(i)) chosen.delete(i); else { if (!multi) chosen.clear(); chosen.add(i); }
    sync();
  });
  skip.onclick = () => { closeModal(); if (onDone) onDone(false); };
  submit.onclick = () => {
    const res = gradeAnswer(key, Array.from(chosen));
    if (!res) return;
    opts.forEach(b => {
      const i = Number(b.dataset.i);
      b.classList.remove('on'); b.classList.add(q.answer.indexOf(i) >= 0 ? 'right' : 'picked'); b.disabled = true;
    });
    submit.disabled = true;
    submit.textContent = res.ok ? `✓ 答对 +${res.gained}` : '✗ 答错';
    fb.classList.remove('hidden');
    fb.innerHTML = `<div class="qf-head ${res.ok ? 'ok' : 'no'}">${res.ok ? `回答正确（+${res.gained} 分）` : '回答错误'}</div>

      <h4>解析</h4><p>${q.explain}</p>
      <p class="muted">${q.source}</p>
      ${res.newTrophies.length ? `<div class="quiz-trophy">${res.newTrophies.map(t2 => `${t2.icon} 获得奖杯「${t2.name}」`).join('　')}</div>` : ''}

    const next = fb.querySelector('#quiz-next');

// 真实城市规划的同心环 + 风向分区：中心是 CBD，内环住区，中环住商混合，
// 工业区只落在下风向一侧，电厂在下风向远郊、水厂在上风向，最外圈留绿带。
const RING = { cbd:0.10, inner:0.34, mixed:0.50, industry:0.72 };
const ROAD_STEP = 5;
const isDownwind = ang => ang > Math.PI / 10 && ang < Math.PI * 9 / 10;
const tiles = [];
for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
  const cx = (GW - 1) / 2, cy = (GH - 1) / 2, maxR = Math.min(cx, cy);
  const d = Math.hypot(x - cx, y - cy) / maxR;
  const ang = Math.atan2(y - cy, x - cx);
  const ring = ringIndexOf(d);          // 控规环带：指标按「离市中心多远」给定
  let type, rclass = 0;
  const arterial = Math.abs(x - cx) <= 0.6 || Math.abs(y - cy) <= 0.6;
  const ringRoad = Math.abs(d - 0.34) < 0.022 || Math.abs(d - 0.62) < 0.022;
  // 路网横平竖直：主干道 + 环路 + 每 5 格一条支路；支路按 10% 概率随机缺失，避免棋盘过于死板
  const branch = x % ROAD_STEP === 0 || y % ROAD_STEP === 0;
  if (arterial) { type = 'road'; rclass = 3; }
  else if (ringRoad) { type = 'road'; rclass = 2; }
  else if (branch && rnd() > 0.10) { type = 'road'; rclass = 1; }
  else if (d < RING.cbd) type = 'c';
  else if (d < RING.inner) type = 'r';
  else if (d < RING.mixed) type = ((Math.floor(x / ROAD_STEP) + Math.floor(y / ROAD_STEP)) % 2 === 0) ? 'c' : 'r';
  else if (d < RING.industry) type = isDownwind(ang) ? 'i' : 'r';
  else type = 'e';
  const centrality = 1 - Math.min(1, Math.hypot(x - cx, y - cy) / maxR);
  tiles.push({
    type, rclass, ring,
    planLevel: planLevelOf(type, ring),                                  // 控规容积率等级（法定上限）
    dev:false, density:0, level:1,
    value: Math.max(300, (LAND_BASE + centrality * 2400) * (0.85 + rnd() * 0.3)), // 地价带随机扰动
    pollution:0, amenity:0
  });
}

  }
  for (let n = 0; n < 4 && poolP.length; n++) { const k = (rnd() * poolP.length) | 0; tiles[poolP[k]].type = 'p'; poolP.splice(k, 1); }
  for (let n = 0; n < 3 && poolW.length; n++) { const k = (rnd() * poolW.length) | 0; tiles[poolW[k]].type = 'w'; poolW.splice(k, 1); }
  let flip = 0;
  for (let by = 2; by < GH - 2; by += 6) for (let bx = 2; bx < GW - 2; bx += 6) {
    const i = by * GW + bx;
    if (tiles[i].type === 'r') tiles[i].type = flip++ % 2 === 0 ? 's' : 'h';
  }
})();

const stageIdx = id => Math.max(0, STAGES.findIndex(s => s.id === id));
// tier：概念条件与视角解锁都按它判定，阶段细分不会改变"发展到城市级"这类门槛的含义
const tierOfStage = id => STAGES[stageIdx(id)].tier;

const unlockedPersp = () => {

function developCity(st) {
  for (let y = 0, i = 0; y < GH; y++) for (let x = 0; x < GW; x++, i++) {
    const t = tiles[i];
    if (t.dev || Math.hypot(x - GW / 2, y - GH / 2) > st.radius || !st.allow.includes(t.type)) continue;
    t.dev = true; t.level = 1;
  }
}

// —— 地块演化：密度/地价/污染/等级/用途转换 ——
function evolveTiles() {
  const N = tiles.length;
  const emit = new Float32Array(N);
  const resTiles = tiles.filter(t => t.dev && t.type === 'r');
  // 每块住区承载多少「户」：人口先折成户，否则密度会被放大 2.6 倍直接顶满
  const perRes = resTiles.length ? state.pop / HOUSEHOLD_SIZE / resTiles.length : 0;
  const util = state.util;

  for (let i = 0; i < N; i++) {
    const t = tiles[i];
    if (!t.dev) continue;
    if (t.type === 'i') emit[i] = 0.004 * t.level + 0.003;
    else if (t.type === 'p') emit[i] = 0.003 * t.level;
    else if (t.type === 'road') emit[i] = 0.001;
  }
  const selfClean = 0.9 + gov.publicSpend * 0.06;
  const nPol = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const x = i % GW, y = (i / GW) | 0;
    let s = 0, n = 0;
    if (x > 0) { s += tiles[i-1].pollution; n++; }
    if (x < GW-1) { s += tiles[i+1].pollution; n++; }
    if (y > 0) { s += tiles[i-GW].pollution; n++; }
    if (y < GH-1) { s += tiles[i+GW].pollution; n++; }
    nPol[i] = Math.min(1, tiles[i].pollution * selfClean + emit[i] + (n ? s / n : 0) * 0.07);
  }
  // 公共服务辐射
  const serviceK = 0.5 + gov.publicSpend * 1.6;
  const RAD = { s:[0.75,4], h:[0.8,5], w:[0.35,3], p:[0.3,2] };
  const nAm = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const t = tiles[i];
    if (!t.dev || !RAD[t.type]) continue;
    const [str, rad] = RAD[t.type];
    const sx = i % GW, sy = (i / GW) | 0;
    for (let dy = -Math.ceil(rad); dy <= rad; dy++) for (let dx = -Math.ceil(rad); dx <= rad; dx++) {
      const nx = sx + dx, ny = sy + dy;
      if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue;
      const d = Math.hypot(dx, dy);
      if (d > rad) continue;
      nAm[ny * GW + nx] += str * serviceK * (1 - d / rad);
    }
  }
  for (let i = 0; i < N; i++) {
    const t = tiles[i];
    t.pollution = nPol[i];
    t.amenity = Math.min(1, nAm[i]);
    if (!t.dev) { t.density = 0; continue; }
    let target = t.density;
    if (t.type === 'r') target = Math.min(1, perRes / (2 + t.level * 3));
    else if (t.type === 'c') target = 0.35 + Math.min(1, state.cpi / 130) * 0.5;
    else if (t.type === 'i') target = 0.4 + util * 0.55;
    else if (t.type === 'road') target = util;
    else target = 0.5;
    t.density += (target - t.density) * 0.25;

    const x = i % GW, y = (i / GW) | 0;
    const centrality = 1 - Math.min(1, Math.hypot(x - GW / 2, y - GH / 2) / Math.hypot(GW / 2, GH / 2));
    const nearRoad = (x > 0 && tiles[i-1].type === 'road') || (x < GW-1 && tiles[i+1].type === 'road')
      || (y > 0 && tiles[i-GW].type === 'road') || (y < GH-1 && tiles[i+GW].type === 'road');
    // 楼面地价（元/㎡）：与 src/sim/tiles.ts 同一套权重，量级 600~3,100
    const tv = Math.max(100, Math.min(8000,
      LAND_BASE * 0.8 + centrality * 900 + (nearRoad ? 450 : 0) + t.density * 1100
      + t.amenity * 800 - t.pollution * 900 + (t.level - 1) * 250));
    t.value += (tv - t.value) * 0.18;

    // 加建只能加在「控规容积率上限」之内：等级顶到 planLevel 就停，想再高得等控规调整
    const cap = Math.min(5, t.planLevel ?? 5);
    if (t.type === 'r' || t.type === 'c' || t.type === 'i') {
      if (t.density > 0.75 && t.value > 1300 && t.level < cap) t.level++;
      else if (t.density < 0.2 && t.value < 640 && t.level > 1) t.level--;
    }
    // 用途转化：住区满员且临街 → 破墙开店；商铺长期冷清 → 退回住区
    // 用途变了，控规等级跟着新用途重取（住区 4 级 → 商业 5 级，CBD 才能长成塔楼群）
    if (t.type === 'r' && nearRoad && t.density > 0.85 && t.value > 1700 && rnd() < 0.05) {
      t.type = 'c'; t.level = 1; t.planLevel = planLevelOf('c', t.ring);
    } else if (t.type === 'c' && t.density < 0.15 && t.value < 560 && rnd() < 0.05) {
      t.type = 'r'; t.level = 1; t.planLevel = planLevelOf('r', t.ring);
    }
  }
}

/* ═══════════════ 4. 图层渲染 ═══════════════ */
// 地图只渲染「当前阶段的视野范围」：村庄 11×11（看得见家门口），大都市 39×39（看得见全城）。
// 视野变化时重建 DOM，其它时候只改颜色。
const gridEl = document.getElementById('city-grid');
const VOID_BG = '#07080c';
let viewSize = 0, curView = -1, layer = 'usage', selected = null;
// 格子像素尺寸 = 面板可用空间 / 视野格数，取宽高中较小的那个，保证整张地图不被裁切
function fitGrid() {
  const wrap = gridEl.parentElement || gridEl;
  const n = viewSize || 1;
  const availW = Math.max(160, (wrap.clientWidth || 620) - 6);
  const availH = Math.max(160, (wrap.clientHeight || 460) - 6);
  const cell = Math.max(4, Math.min(46, Math.floor(Math.min(availW, availH) / n) - 1));
  const px = cell * n + (n - 1);
  gridEl.style.gridTemplateColumns = `repeat(${n},${cell}px)`;
  gridEl.style.gridTemplateRows = `repeat(${n},${cell}px)`;
  gridEl.style.width = px + 'px';
  gridEl.style.height = px + 'px';
}
function buildGrid(force) {
  const vr = curStage().view;
  if (!force && vr === curView && gridEl.children.length === (vr * 2 + 1) ** 2) { fitGrid(); return; }
  curView = vr;
  viewSize = vr * 2 + 1;
  gridEl.innerHTML = '';
  const ccx = GW >> 1, ccy = GH >> 1;
  for (let vy = 0; vy < viewSize; vy++) for (let vx = 0; vx < viewSize; vx++) {
    const gx = ccx - vr + vx, gy = ccy - vr + vy;
    const idx = (gx >= 0 && gy >= 0 && gx < GW && gy < GH) ? gy * GW + gx : -1;
    const d = document.createElement('div');
    d.className = 'tile' + (idx < 0 ? ' void' : '');
    d.dataset.i = String(idx);
    d.onclick = () => {
      if (idx < 0) return;
      selected = selected === idx ? null : idx;
      paintCity(); renderTileInfo();
    };
    gridEl.appendChild(d);
  }
  fitGrid();
}
window.addEventListener('resize', () => { fitGrid(); });

const HEX = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function mix(a, b, k) {
  const A = HEX(a), B = HEX(b);
  return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*Math.max(0,Math.min(1,k)))).join(',')})`;
}
function shade(a, k) { const A = HEX(a); return `rgb(${A.map(v=>Math.min(255,Math.round(v*k))).join(',')})`; }
const HEAT = ['#123a6b','#1d7fa8','#38b764','#f3c13a','#e6484f'];
function heat(t) {
  const k = Math.max(0, Math.min(1, t)) * (HEAT.length - 1);
  const i = Math.min(HEAT.length - 2, Math.floor(k));
  return mix(HEAT[i], HEAT[i + 1], k - i);
}
function layerVal(t) {
  if (layer === 'value') return Math.min(1, t.value / 3000);
  if (layer === 'density') return t.density;
  if (layer === 'pollution') return t.pollution;
  if (layer === 'level') return (t.level - 1) / 4;
  if (layer === 'amenity') return t.amenity;
  return 0;
}
function paintCity() {
  const kids = gridEl.children;
  for (let k = 0; k < kids.length; k++) {
    const el = kids[k], idx = Number(el.dataset.i);
    if (idx < 0 || !tiles[idx]) { el.style.background = VOID_BG; continue; }
    const t = tiles[idx];
    let bg;
    if (!t.dev) bg = TILE_BASE.e;
    else if (layer === 'usage') {
      bg = shade(TILE_BASE[t.type] || TILE_BASE.e, 0.7 + (t.level - 1) * 0.15);
      if (t.pollution > 0.05) bg = mix(bg, '#6b4a2b', Math.min(0.55, t.pollution));
    } else bg = heat(layerVal(t));
    el.style.background = bg;
    el.classList.toggle('sel', selected === idx);
  }
}

/* 地块详情 */
function renderTileInfo() {
  const el = document.getElementById('tile-info');
  if (selected === null) { el.classList.add('hidden'); return; }
  const t = tiles[selected];
  const ring = Math.min(t.ring ?? 5, 5);
  const isBuilt = t.type !== 'road' && t.type !== 'e';
  const far = farOf(t.type, t.level), farPlan = farOf(t.type, t.planLevel ?? t.level);
  const cap = popCapOf(t.type, t.level), job = jobCapOf(t.type, t.level);
  const svc = serviceCapOf(t.type, t.level);
  const rows = [
    ['坐标', `${selected % GW} , ${Math.floor(selected / GW)}`],
    ['用途', TILE_NAME[t.type]],
    ['所在环带', RING_LABELS[ring]],
    ['状态', t.dev ? '已建成' : '待开发']
  ];
  if (t.type === 'road') {
    rows.push(['道路等级', ROAD_LABEL[t.rclass || 1]], ['红线宽度', (ROAD_WIDTH[t.rclass || 1]) + ' m']);
  } else if (isBuilt) {
    // 规划指标：都是「控规给的法定上限」与「现状开发强度」成对出现，方便对照看还剩多少余地
    rows.push(
      ['开发强度', `${t.level} 级 / 控规 ${t.planLevel ?? '-'} 级`],
      ['容积率', `${far.toFixed(2)}（控规上限 ${farPlan.toFixed(2)}）`],
      ['建筑密度', `${(coverageOf(t.type, t.level) * 100).toFixed(0)}%`],
      ['绿地率', `${(greenRateOf(t.type, t.level) * 100).toFixed(0)}%`],
      ['建筑层数', `${floorsOf(t.type, t.level).toFixed(1)} 层 · 限高 ${Math.round(floorsOf(t.type, t.level) * 3)} m`],
      ['建筑面积', `${Math.round(gfaOf(t.type, t.level)).toLocaleString('zh-CN')} ㎡`]
    );
    if (cap > 0) rows.push(['承载人口', `${cap.toLocaleString('zh-CN')} 人`]);
    if (job > 0) rows.push(['岗位承载', `${Math.round(job).toLocaleString('zh-CN')} 个`]);
    if (svc) rows.push([svc[0], `${svc[1].toLocaleString('zh-CN')} ${svc[2]}`]);
  }
  rows.push(
    ['等级', t.level + ' 级'],
    ['密度', (t.density * 100).toFixed(0) + '%'],
    ['地价', landPrice(t.value)],
    ['污染', (t.pollution * 100).toFixed(0) + '%'],
    ['公共服务', (t.amenity * 100).toFixed(0) + '%']
  );
  el.classList.remove('hidden');
  el.innerHTML = `<div class="ti-head"><b>地块详情</b><button class="ti-close" id="ti-x">×</button></div>` +
    rows.map(([k, v]) => `<div class="ti-row"><span class="ti-k">${k}</span><span class="ti-v">${v}</span></div>`).join('');
  document.getElementById('ti-x').onclick = () => { selected = null; paintCity(); renderTileInfo(); };
}

function showRules() {

    <h4>循环式玩法</h4>
    <p>一轮 = <b>个人 → 企业 → 政府</b> 各主导一段，走完回到个人视角进入下一轮，共 ${setup.rounds} 轮。
      企业和政府的参数会反过来改变家庭面对的物价、工资与税率，所以第二轮回到个人视角时，你看到的已经不是同一道题。</p>
    <h4>概念怎么解锁</h4>
    <p>概念按轮次<b>分层</b>：第 N 轮只放出第 N 层，而且<b>一次只点亮一个</b>、隔几个月才来下一个。
      每个概念都会告诉你"是因为你做了什么"——条件来自你拧过的旋钮、你造成的城市状态，
      甚至是<b>城市正处在经济周期的哪个阶段</b>。挂机推不动它。</p>
    <h4>经济周期</h4>
    <p>顶栏左侧的「${PHASE_META.recovery.icon} 阶段条」是这座城市的天气：景气在<b>繁荣 → 衰退 → 萧条 → 复苏</b>之间循环，
      点开能看到景气曲线与产出缺口。福利、公共支出、税率是<b>自动稳定器</b>（削平谷底）；
      产业补贴、扩产、库存与贸易开放是<b>放大器</b>（让波动更剧烈、周期更短）。周期是你自己拧出来的。</p>
    <h4>闯关问答</h4>
    <p>每解锁一个名词，都会弹一次「简介 + 一道题」（题型参考<b>中级经济师</b>）。答对得积分、连对有加成、达标发奖杯，
      进度在顶栏「🎓」里随时查看、可重做错题。全部 ${TERMS.length} 个名词通关，你就走完了中级经济师经济学基础的主干知识点。</p>
    <h4>看什么</h4>
    <p>顶栏是<b>随视角切换的实时变量条</b>：个人看家庭账本、企业看经营盘面、政府看宏观盘面；点开有详情与累积曲线。
      右侧仪表盘与政策滑杆随你认识的名词逐个开放。</p>
    <h4>地图不是色块</h4>
    <p>每格都有密度、地价、污染、等级与公共服务。中心是 CBD，向外依次是内城住宅、住商混合、工业带（只在下风向）、绿带；
      视野随城市长大逐步拉远。切图层看分布，点格子看细节——工厂围城会真的把居民赶走。</p>
    <h4>数值口径</h4>
    <p>所有数字都按现实量级标定：钱用<b>元</b>、工资用<b>元/月</b>、人口用<b>人</b>（1 户 ≈ 2.6 人）、
      商品用<b>件</b>、地价用<b>元/㎡</b>、CPI 用<b>点</b>（默认政策 = 100）。
      顶栏的「单位」按钮里有完整对照表与每个口径的现实锚点，看不懂某个数字时点开对一下。</p>
    <h4>没有输赢</h4>
    <p>繁荣与衰退都是参数自然跑出来的结果，重要的是理解它们怎么发生。</p>
    <button class="close" data-close>开始游戏</button>`);
}

/* ═══════════════ 6. 视角（渐进解锁） ═══════════════ */
const PERSP = [
  { id:'household', label:'个人视角', icon:'🧑', who:'你是一名普通居民', duty:'决定怎么花钱、要不要找工作、练什么技能', watch:'可支配收入、生活水平、家庭财富、抗风险缓冲' },
  { id:'firm', label:'企业视角', icon:'🏭', who:'你是一家企业的经营者', duty:'决定卖什么价、开多少工资、要不要扩产、投多少研发', watch:'平均利润、产能利用率、平均售价、总营收' },
  { id:'gov', label:'政府视角', icon:'🏛', who:'你是这座城市的治理者', duty:'决定税率、公共支出、补贴与贸易政策', watch:'GDP、失业率、CPI、财政、幸福度、基尼系数' }
];
let perspective = 'household';
let seenPersp = ['household'];

// 统一入口：切视角要同时更新 tab、政策面板、仪表盘与顶栏变量条
function setPerspective(id) {
  perspective = id;
  markPhase(id);
  syncTabs(); renderPolicy(); renderDash(); renderHud(); renderCycle();
}

const tabsEl = document.getElementById('tab-group');
const tabBtns = {};
PERSP.forEach(p => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.onclick = () => {
    if (!unlockedPersp().includes(p.id)) { showLockedPersp(p); return; }
    if (p.id === perspective) return;
    setPerspective(p.id);
  };
  tabsEl.appendChild(b); tabBtns[p.id] = b;
});
function syncTabs() {
  const open = unlockedPersp();
  PERSP.forEach(p => {
    const b = tabBtns[p.id], ok = open.includes(p.id);
    b.classList.toggle('locked', !ok);
    b.classList.toggle('active', ok && p.id === perspective);
    if (ok) { b.innerHTML = `${p.icon} ${p.label}`; b.title = p.who + '：' + p.duty; }
    else {
      const gate = STAGES.find(s => s.persp === p.id);
      b.innerHTML = `🔒 ${p.label}<span class="tab-sub">${gate ? gate.name : ''}解锁</span>`;
      b.title = '尚未解锁，点击查看条件';
    }
  });
}
function showLockedPersp(p) {
  const gate = STAGES.find(s => s.persp === p.id);
  showModal(`<div class="chapter">视角未解锁</div><h2>${p.icon} ${p.label}</h2>
    <p>游戏从<b>个人视角</b>开始——你先是这座城市里的一名普通居民。城市长大之后，你才有机会站到经营者、治理者的位置上。</p>
    <h4>解锁条件</h4>
    <p>城市发展到「${gate.name}」（人口 ≥ ${gate.minPop.toLocaleString()} 人，且存续 ≥ ${gate.minMonths} 个月）。</p>
    <p class="muted">当前人口 ${people(state.pop)} · 已存续 ${state.t} 个月 · 阶段「${curStage().name}」</p>
    <h4>解锁后</h4><p><b>${p.who}</b>：${p.duty}。重点关注 ${p.watch}。</p>
    <button class="close" data-close>知道了</button>`);
}
function showUnlockPersp(p) {
  showModal(`<div class="chapter">新视角解锁</div><h2>${p.icon} ${p.label}</h2>
    <p>城市长大了，你现在可以换一个身份看它——<b>${p.who}</b>。</p>
    <h4>你要做的决策</h4><p>${p.duty}。</p>
    <h4>重点关注</h4><p>${p.watch}。</p>
    <p class="muted">三种视角操作的是同一座城市：你在企业视角提高工资，会以成本的形式反映到政府视角的物价与就业上。</p>
    <button class="close" data-close>开始体验</button>`);
}
function checkPerspUnlock() {
  const open = unlockedPersp();
  const fresh = open.filter(p => !seenPersp.includes(p));
  seenPersp = open;
  if (!fresh.length) return;
  const id = fresh[fresh.length - 1];
  setPerspective(id);
  showUnlockPersp(PERSP.find(p => p.id === id));
}

/* ═══════════════ 7. 政策 / 仪表盘 ═══════════════ */
const SCOPE_TITLE = { gov:'政府政策', household:'家庭决策', firm:'企业经营' };
const SCOPE_KEY = { gov:'gov', household:'household', firm:'firm' };
function renderPolicy() {
  const el = document.getElementById('policy');
  const scope = perspective;
  const vals = PARAMS[SCOPE_KEY[scope]];
  const open = LEVERS.filter(l => l.scope === scope && leverOpen(l));
  const lock = LEVERS.filter(l => l.scope === scope && !leverOpen(l));
  el.innerHTML = `<h3>${SCOPE_TITLE[scope]}</h3><div id="levers"></div>
    <p class="muted" style="margin-top:8px;font-size:10.5px">拖动即改变经济系统的约束；点名称看释义。随城市成长与概念解锁，会放出更多工具。</p>`;
  const wrap = el.querySelector('#levers');
  open.forEach(l => {
    const row = document.createElement('div');
    row.className = 'slider-row';
    row.innerHTML = `<label>${l.label}</label><input type="range" min="${l.min}" max="${l.max}" step="${l.step}" value="${vals[l.id]}"><span class="val">${l.fmt(vals[l.id])}</span>`;
    row.querySelector('label').onclick = () => showTerm(l.id);
    const inp = row.querySelector('input'), out = row.querySelector('.val');
    inp.oninput = () => {
      const v = parseFloat(inp.value);
      vals[l.id] = v; out.textContent = l.fmt(v);
      recomputeFromLevers();
      // 拧旋钮 = 留下玩家痕迹。立刻结算一次：条件满足的名词当场点亮，
      // 它绑定的新滑杆/新指标也当场放出（这就是「决策 → 图谱」的联动）。
      const fresh = runUnlocks(false);
      renderDash(); renderStats(); renderKnowledge(); renderStage(); renderCycle();
      if (fresh.length) { announceUnlocks(fresh); renderPolicy(); }
    };
    wrap.appendChild(row);
  });
  lock.forEach(l => {
    const row = document.createElement('div');
    row.className = 'slider-row locked-row';
    row.innerHTML = `<label>🔒 ${l.label}</label><span class="lock-note">${leverWhy(l)}</span>`;
    row.querySelector('label').onclick = () => showTerm(l.id);
    wrap.appendChild(row);
  });
}

// 杠杆 → 指标（预览用的轻量传导，方向与真实引擎一致）
// CPI 以“默认参数”为 100 基准做归一，否则默认值就会显示成 180 这种离谱物价。
// 最低工资以 ¥2,500 为默认锚点：mwK 把「相对默认值的偏移」折算成成本单位，
// 这样滑杆拉到 ¥15,000 时成本指数 +1.25，售价与 CPI 一起被推上去。
const MW0 = 2500;
const mwK = () => (gov.minWage - MW0) / 10000;
const COST0 = 1 + 1.0 * 0.35 + 0.3;            // 默认成本指数：底薪不偏移 / 工资系数 1.0 / 加成 0.3
const PRICE0 = 0.9 + 0.3 * 0.3;                // 默认加成对应的定价系数
function recomputeFromLevers() {
  const demandK = 1 + gov.tradeOpenness * 0.5;
  const consK = hp.consumptionPropensity * (1 - hp.savingsRate * 0.6) * demandK;
  const k = mwK();
  const costK = 1 + k + fp.wageMultiplier * 0.35 + fp.markup;
  const costRel = (costK / COST0) * ((0.9 + fp.markup * 0.3) / PRICE0);
  // 先算出「政策基准值」，周期再叠加在它上面——这样拧旋钮与周期互不覆盖
  const b = state.base;
  b.price = BASE_PRICE * costRel;               // ¥/件，默认约 ¥104
  b.cpi = 100 * costRel;                        // 点，默认 100
  // 工资锚在基准工资 ¥8,000 上：工资出价与技能投入各占一部分，最低工资只做小幅抬升
  b.wage = BASE_WAGE * (0.62 + 0.28 * fp.wageMultiplier + 0.25 * hp.skillInvest) + k * 1600;
  b.cons = Math.max(CONS_FLOOR, Math.min(b.wage * 1.05, b.wage * consK * 0.8));
  // 就业率的锚点对齐现实：城镇调查失业率的常态是 5% 左右，所以默认就业率约 95%
  b.emp = bcClamp(0.94 + gov.industrySubsidy * 0.04 - k * 0.22 + gov.publicSpend * 0.03, 0.78, 0.995);
  b.util = bcClamp(0.62 + fp.expansion * 0.18 - fp.wageMultiplier * 0.06, 0.3, 1);
  b.rev = b.price * QTY_PER_FIRM * b.util;      // ¥/月：一家企业满产月营收约 ¥10 万
  // 利润率：加成越高越厚，最低工资/税率越高越薄，默认落在 7% 上下（与现实制造业接近）
  const margin = 0.04 + fp.markup * 0.12 - k * 0.05 - gov.taxRate * 0.06
    + gov.industrySubsidy * 0.04 + fp.rdInvest * 0.02;
  b.profit = b.rev * margin;                    // ¥/月
  b.happy = Math.max(30, Math.min(85,
    58 + gov.publicSpend * 12 + gov.welfare * 10 + gov.eduSubsidy * 4 - Math.max(0, b.cpi - 105) * 0.25));
  applyCycle();
}

const MACRO_DEFS = () => [
  ['常住人口', people(state.pop), 'population'],
  ['就业率', (state.emp * 100).toFixed(1) + '%', 'employmentRate'],
  ['平均工资', yuanMo(state.wage), 'avgWage'],
  ['CPI', points(state.cpi), 'cpi'],
  ['GDP（月）', yuan(state.gdp), 'gdp'],
  ['财政余额', yuan(state.treasury), 'treasury'],
  ['幸福度', state.happy.toFixed(0) + ' 分', 'happiness'],
  ['基尼系数', state.gini.toFixed(2), 'gini']
];
const HOUSE_DEFS = () => {
  const di = state.wage * (1 - gov.taxRate);          // 户均税后月收入（¥/月）
  const cover = state.savings / Math.max(1, state.cons); // 存款能撑几个月
  return [
    ['可支配收入', yuanMo(di), 'disposableIncome', di >= 4000],
    ['生活水平', state.happy.toFixed(0) + ' 分', 'livingStandard', state.happy >= 55],
    ['家庭财富', yuan(state.savings), 'wealth', state.savings >= 60000],
    ['抗风险缓冲', cover.toFixed(1) + ' 月', 'resilience', cover >= 2]
  ];
};
const FIRM_DEFS = () => [
  ['平均利润', yuanMo(state.firmProfit), 'avgProfit', state.firmProfit >= 0],
  ['产能利用率', (state.util * 100).toFixed(0) + '%', 'capacityUtil', state.util >= 0.5 && state.util <= 0.95],
  ['平均售价', '¥' + state.price.toFixed(0) + '/件', 'avgPrice', state.price >= 60 && state.price <= 200],
  ['总营收', yuanMo(state.rev), 'totalRevenue', true]
];

function kpiCard(label, value, key, ok) {
  if (!termOk(key)) {
    const g = metricGate(key);
    const why = g ? reqHint(g.req, buildCtx()) : '';
    return `<div class="kpi locked"><div class="k">🔒 ${label}</div><div class="v">${g ? '解锁「' + g.name + '」' : '待解锁'}</div>` +
      (why ? `<div class="k-why">${why}</div>` : '') + `</div>`;
  }
  return `<div class="kpi ${ok ? '' : 'warn'}"><div class="k">${label}${ok ? '' : ' ⚠'}</div><div class="v">${value}</div></div>`;
}
function renderDash() {
  const el = document.getElementById('dashboard');
  const p = PERSP.find(x => x.id === perspective);
  let defs;
  if (perspective === 'gov') defs = MACRO_DEFS().map(d => [d[0], d[1], d[2], true]);
  else if (perspective === 'household') defs = HOUSE_DEFS();
  else defs = FIRM_DEFS();
  const hints = [];
  if (perspective === 'household') {
    if (state.wage * (1 - gov.taxRate) < 4000) hints.push('可支配收入偏低：降低税率、提升技能投入或劳动参与率。');
    if (state.happy < 55) hints.push('生活水平偏低：增加公共支出或福利能直接改善居民体验。');
    if (state.savings < 60000) hints.push('财富积累不足：适度下调储蓄率或提升收入可加快积累。');
  } else if (perspective === 'firm') {
    if (state.firmProfit < 0) hints.push('企业整体亏损：下调加价率/工资出价，或提高研发与库存策略。');
    if (state.util < 0.5) hints.push('产能利用率偏低：需求不足或招工困难，可提高工资出价、下调加价率。');
    if (state.util > 0.95) hints.push('产能接近饱和：提高扩产意愿可扩容接单。');
  }
  el.innerHTML = `<h3>${p.label}指标 <span class="k-count">${state.unlocked.length}/${TERMS.length} 词条</span></h3>
    <div class="kpi-grid">${defs.map(d => kpiCard(d[0], d[1], d[2], d[3])).join('')}</div>
    ${hints.length ? `<div class="hints"><div class="hints-title">⚠ 软提示（偏离建议区间）</div>${hints.map(h => `<div class="hint-item">${h}</div>`).join('')}</div>` : ''}
    <p class="muted" style="margin-top:7px;font-size:10.5px">指标随你解锁的「名词」逐个开放。</p>`;
  el.querySelectorAll('.kpi').forEach((c, i) => { c.onclick = () => showTerm(defs[i][2]); });
}

function renderKnowledge() {
  const el = document.getElementById('knowledge');
  const total = TERMS.length, un = state.unlocked.length;
  const tier = Math.min(5, state.cycle.round);
  const tierList = TERMS.filter(t => (t.tier || 1) === tier);
  const tierUn = tierList.filter(t => state.unlocked.includes(t.key)).length;
  let html = `<h3>经济学图谱 <span class="k-count">第 ${tier} 层 <b>${tierUn}</b>/${tierList.length} · 总计 ${un}/${total}</span></h3>`;
  html += `<div class="muted" style="margin:-4px 0 8px;font-size:10.5px">概念按<b>循环轮次</b>分层：第 N 轮只放出第 N 层，一次点亮一个、隔几个月才来下一个。</div>`;
  ['micro', 'industrial', 'macro'].forEach(ch => {
    const list = TERMS.filter(t => t.chapter === ch);
    const u = list.filter(t => state.unlocked.includes(t.key)).length;
    html += `<div class="kchapter"><span>${CH_LABEL[ch]}</span><span>${u}/${list.length}</span></div><div class="kterms">`;
    html += list.map(t => {
      const ok = state.unlocked.includes(t.key);
      const tt = t.tier || 1;
      const tip = ok ? t.name
        : `第 ${tt} 层${tt > tier ? `（第 ${tt} 轮才开放）` : ''}：${reqHint(t.req, buildCtx())}`;
      const mk = ok ? termMark(state.quiz, t.key) : 'none';
      return `<button class="kchip ${ok ? 'unlocked' : 'locked'} ${mk === 'ok' ? 'mark-ok' : mk === 'wrong' ? 'mark-wrong' : ''}" data-k="${t.key}" title="${tip}">${ok ? '' : '🔒'}${t.name}</button>`;
    }).join('');
    html += `</div>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('.kchip').forEach(b => b.onclick = () => showTerm(b.dataset.k));
}

/* ═══════════════ 8. 顶栏变量条 / 循环条 / 阶段条 ═══════════════ */

const HUD_STATE_KEYS = { gdp:'gdp', cpi:'cpi', treasury:'treasury', gini:'gini', happiness:'happy',

// 顶栏显示的必须是「此刻」的值：拧完滑杆当场就变。

function sparkline(arr, up) {

function lineChart(arr, fmt) {

function renderStage() {

    const pr = (state.pop - cur.minPop) / Math.max(1, next.minPop - cur.minPop);
    const mr = (state.t - cur.minMonths) / Math.max(1, next.minMonths - cur.minMonths);
    ratio = Math.max(0, Math.min(1, Math.min(pr, mr)));
  }
  const steps = STAGES.map((s, i) => `<span class="stage-step ${i <= stageIdx(state.stage) ? 'on' : ''}">${s.icon}</span>`).join('<span class="stage-arrow">›</span>');

/* ═══════════════ 9. 推进一个月 ═══════════════ */
function checkStage() {
  let idx = 0;
  for (let i = STAGES.length - 1; i >= 0; i--) {
    const s = STAGES[i];
    if (state.pop >= s.minPop && state.t >= s.minMonths) { idx = i; break; }
  }
  const cur = stageIdx(state.stage);
  if (cur > idx && state.pop >= STAGES[cur].minPop * 0.85) idx = cur;
  if (idx === cur) return null;
  state.stage = STAGES[idx].id;
  if (idx > stageIdx(state.peak)) state.peak = state.stage;
  developCity(STAGES[idx]);
  return { from: STAGES[cur], to: STAGES[idx], up: idx > cur };
}

function tick() {
  state.t++;
  state.month++; if (state.month > 12) { state.month = 1; state.year++; }
  // ① 先推进经济周期（景气乘数当月就作用在需求与投资上），政策已在本月生效
  const bc = stepBC();
  // ② 轻量演化：与真实引擎的方向一致（增长 → 需求 → 利润 → 迁入）
  // 景气对产出的拉动给到 ±1.2%：萧条期 GDP 真的会环比收缩，产出缺口才走得进负区间。
  const growth = 1 + ((state.firmProfit > 0 ? 0.010 : 0.003) + gov.publicSpend * 0.002) * bc.demandMult + bc.index * 0.012;
  // GDP 是「城市当月增加值」（元/月）：噪声按总量比例给，不能是固定 12 元
  state.gdp = Math.max(300000, state.gdp * growth + (rnd() - 0.4) * state.gdp * 0.004);
  updateGap(state.gdp);          // 产出缺口：实际产出围着趋势线摆动
  applyCycle();                  // 景气 → 就业 / 物价 / 利润 / 产能
  // 迁移按「户」决策、落到「人」要乘 HOUSEHOLD_SIZE。
  // 固定项是「岗位拉力」，比例项是「已有规模的自增效应」（大城市更容易吸引人）。
  // 两项合起来让村庄 → 大都市约 10~14 年走完，与真实引擎的节奏对齐。
  state.pop += (((state.firmProfit > 0 ? 4 : 0.8) + rnd() * 6 + (state.happy - 60) * 0.35)
    * (0.6 + bc.demandMult * 0.4) * HOUSEHOLD_SIZE)
    + state.pop * 0.004 * (0.3 + bc.demandMult * 0.7);
  state.pop = Math.max(160, state.pop);
  state.savings += state.wage * (1 - gov.taxRate) * hp.savingsRate;
  // 财政：税收基数是工资+消费+利润的合计（简化为工资的 1.35 倍），支出按户、补贴按全城计
  const hh = state.pop / HOUSEHOLD_SIZE;
  state.treasury += hh * state.wage * gov.taxRate * 1.35
    - hh * GOV_SPEND_K * gov.publicSpend
    - hh * WELFARE_K * gov.welfare
    - gov.industrySubsidy * SUBSIDY_CITY - gov.eduSubsidy * EDU_CITY;
  // 物价围绕（政策 + 产出缺口决定的）中枢波动，不无限漂移
  state.cpi += (state.cpiBase - state.cpi) * 0.12 + (rnd() - 0.5) * 0.6;
  state.happy = Math.max(30, Math.min(85,
    58 + gov.publicSpend * 12 + gov.welfare * 10 - Math.max(0, state.cpi - 105) * 0.22
    + (state.emp - 0.9) * 40 + (rnd() - 0.5) * 2));

  // 个体博弈的结果：亏损到一定程度就有企业退出市场（长期拧错政策的代价）
  if (state.firmProfit < -2000) state.bankruptcies += 1;
  // 城市定位由长期政策偏向涌现；序列供顶栏画累积曲线
  state.orientation = evaluateOrientation();
  updateSeries();

  evolveTiles();
  const sc = checkStage();
  const fresh = runUnlocks(true);   // 每月结算：只认「你造成的城市状态」，纯挂机推不动
  const cyc = tickCycle();          // 循环：个人 → 企业 → 政府 → 回到个人
  if (sc) buildGrid();              // 阶段变了 → 视野跟着变，重建取景格子
  paintCity(); renderStats(); renderBC(); renderCycle(); renderStage(); renderDash(); renderKnowledge(); renderPolicy();
  if (selected !== null) renderTileInfo();
  if (sc) {
    toast(sc.up ? `${sc.to.icon} 城市升级为「${sc.to.name}」：${sc.to.unlockNote}` : `⚠ 城市衰退为「${sc.to.name}」：人口外流`);
    checkPerspUnlock();
  }
  // 换阶段先播报天气，再弹题——玩家会先知道"为什么这个名词现在才出现"
  if (bcDirty) { bcDirty = false; announcePhase(); }
  // 解锁弹题与循环轮转都用同一个弹窗：同月撞车时只弹题，轮转降级成提示条
  if (fresh.length) {
    announceUnlocks(fresh);
    if (cyc) { markPhase(cyc.phase); setPerspective(cyc.phase);
      toast(cyc.kind === 'round' ? `🔁 进入第 ${cyc.round} 轮循环 · ${PHASE_LABEL[cyc.phase]}` : `🔄 本轮轮到${PHASE_LABEL[cyc.phase]}`); }
  } else if (cyc) announceCycle(cyc);
}

// 解锁播报：一次只会有一个（解锁引擎保证），所以直接说清楚"因为什么"
