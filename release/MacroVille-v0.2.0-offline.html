ffects:"决定劳动力供给规模，进而影响企业招工难度、工资水平与整体产出。"},{id:"micro-unemployment",title:"失业",chapter:"micro",check:e=>xd(e)>0,definition:"有劳动能力且愿意工作的人找不到工作的状态。分三类：摩擦性（换工作间隙）、结构性（技能与岗位不匹配）、周期性（总需求不足导致企业裁员）。",example:"看顶部「失业率」指标。本局开局若企业数量少、岗位不足，会出现失业者。若失业率持续走高，往往是企业利润被高工资/高税挤压、停止招工所致（周期性失业）。",experiment:"用「产业补贴」刺激企业扩招，或直接降低「最低工资」减轻企业负担，观察接下来 1–2 年失业率是否回落。",advanced:"自然失业率 = 摩擦性 + 结构性失业（经济健康时也存在的底线）；周期性失业随经济周期波动，是政策主要调控对象。奥肯定律：实际 GDP 低于潜在 GDP 时，失业率高于自然率，且缺口越大失业越多。",unlockHint:"当出现失业居民（失业率 > 0）时解锁。",affectedBy:"受最低工资、产业补贴、总需求影响：高最低工资与低需求推高失业，补贴与开放度降低失业。",affects:"失业抬高社会负担、拉低幸福度与消费，形成需求不足的恶性循环。"},{id:"industrial-agglomeration",title:"集聚效应",chapter:"industrial",check:e=>_d(e)>5,definition:"同类或相关产业在空间上集中，带来共享基础设施、劳动力池与知识溢出，从而降低平均成本、提升生产效率。",example:"本局当某区域企业平均雇员规模突破 5，说明产业开始集聚。你会发现单位产出所需的工资/基建成本相对下降，城市 GDP 增速加快。",experiment:"集中对某一产业发放补贴，引导企业扎堆建在同一片区，对比分散布局时的总产出与幸福度。",advanced:"源自马歇尔（Marshall）外部经济理论，现代表现为产业集群（如硅谷、长三角制造带）。注意：集聚过度也会产生拥堵、地价上涨等负外部性，存在最优规模。",unlockHint:"当平均企业雇员规模 > 5（产业开始集聚）时解锁。",affectedBy:"受产业补贴与公共支出影响：补贴引导企业扎堆，基建完善强化集聚。",affects:"集聚降低平均成本、提升全要素生产率，加速 GDP 增长，但过度集聚产生负外部性。"},{id:"industrial-externality",title:"外部性",chapter:"industrial",check:e=>e.indicators.happiness<50,definition:"一个经济主体的行为对旁观者产生未补偿的影响。正外部性（教育、绿地）惠及他人；负外部性（污染、拥堵）损害他人，二者都会导致市场失灵。",example:"本局当幸福度（happiness）跌破 50，往往源于产业密集带来的拥堵/污染等负外部性——企业获利但居民买单，GDP 涨了幸福却跌了。",experiment:"在幸福度走低时，提高「公共服务支出」或「福利支出」补贴绿化与基建，看能否抵消负外部性、把幸福度拉回 50 以上。",advanced:"外部性导致市场失灵，需政府干预：对负外部性征税（庇古税 Pigouvian tax），对正外部性补贴。延伸阅读：科斯定理——只要产权界定清晰、交易成本为零，当事人可谈判将外部性内部化。",unlockHint:"当幸福度 < 50（产业密集的负外部性显现）时解锁。",affectedBy:"受产业规模与公共/福利支出影响：产业越密负外部性越强，公共与福利支出可抵消。",affects:"负外部性拉低幸福度、触发人口迁出；正外部性（教育/绿地）惠及长期增长。"},{id:"macro-gdp",title:"GDP（国内生产总值）",chapter:"macro",check:e=>e.month>1,definition:"一国/一城在一定时期内生产的全部最终产品和服务的市场价值。支出法构成：GDP = 消费 C + 投资 I + 政府支出 G + 净出口 NX。",example:"本局 GDP 由居民总消费（雇员工资 × 消费倾向）、企业投资（新增产能）、政府支出（公共基建/补贴）加总。开局第 2 个月即可在仪表盘看到 GDP 曲线。",experiment:"把「税率」从低档拉到高档，观察政府支出 G 增加，但居民可支配收入与消费 C 下降，GDP 可能先升后降——体会乘数效应与挤出效应。",advanced:"名义 GDP（按当年价）vs 实 得利润","市场价格与生产成本之差"],1,"消费者剩余 = 支付意愿 − 实际支付，衡量消费者从交易中获得的净福利；对应的生产者剩余则是价格与边际成本之差。","中级经济师·经济基础知识·第一章"),T("producerSurplus","在完全竞争市场长期均衡时，生产者剩余在数值上等于：",["零","经济利润","固定成本","总收益"],1,"长期均衡时价格等于边际成本也等于平均成本最低点，经济利润为零；短期中生产者剩余表现为价格超过边际成本的部分，即经济利润。","中级经济师·经济基础知识·第四章 市场结构理论"),T("sunkCost","关于沉没成本，理性决策者应当：",["在决策时充分考虑已发生的沉没成本","在决策时不考虑沉没成本，只比较边际收益与边际成本","把沉没成本计入固定成本分摊","只有在亏损时才考虑沉没成本"],1,"沉没成本是已经发生且无法收回的支出，与当前决策无关。理性决策只对未来的边际收益与边际成本作比较，俗话即「不要为打翻的牛奶哭泣」。","中级经济师·经济基础知识·第三章"),T("comparativeAdvantage","甲国生产 1 单位粮食需 4 小时、1 单位布需 8 小时；乙国分别需 6 小时和 6 小时。按比较优势理论：",["甲国应出口粮食，乙国应出口布","甲国应出口布，乙国应出口粮食","两国不会发生贸易","甲国两种产品都出口"],0,"甲国粮食机会成本 0.5 单位布（4/8），乙国为 1 单位布（6/6），甲国在粮食上有比较优势；乙国布的机会成本 1 单位粮，低于甲的 2，故出口布。","中级经济师·经济基础知识·第十章 国际贸易理论与政策"),T("wealth","下列属于家庭「存量」概念的是：",["月工资收入","家庭持有的存款余额","本月消费支出","本月缴纳的税额"],1,"存量是某一时点上的数量（存款余额、房产、负债），流量是某一时期内的数量（收入、消费、纳税）。收入是流量，财富是存量。","中级经济师·经济基础知识·第五章"),T("resilience","家庭抗风险缓冲能力最直接体现在：",["月收入的高低","持有流动性资产能覆盖几个月的基本开支","技能水平","是否拥有房产"],1,"抗风险能力取决于「流动性储备 ÷ 必要开支」的倍数关系，而不是收入绝对值。高收入但高负债、无储蓄的家庭同样脆弱。","中级经济师·经济基础知识·第五章"),T("minWage","关于最低工资标准的经济影响，说法正确的是：",["一定会降低所有劳动者的福利","在买方垄断的劳动力市场上，适度提高最低工资可能同时提高工资与就业","对就业没有任何影响","只会影响高收入群体"],1,"在竞争性市场上高于均衡的最低工资会减少就业；但在买方垄断（企业有工资决定权）的市场中，适度的最低工资可以同时提高工资与就业量，这是劳动力市场买方垄断模型的经典结论。","中级经济师·经济基础知识·第六章"),T("markup","企业在成本之上按一定比例加成定价，这种做法主要出现在：",["完全竞争市场","具有市场势力的不完全竞争市场","任何市场都无法实现","只有在政府对价格管制时"],1,"完全竞争厂商是价格接受者，只能按 P=MC 定价；加成定价（P = 成本 ×(1+加成率)）意味着企业拥有一定的定价权，属于不完全竞争市场的行为。","中级经济师·经济基础知识·第四章"),T("wageMultiplier","企业把工资出价提高到高于同行的水平（效率工资），其经济动机通常是：",["纯粹增加成本，没有任何收益","降低离职率、提高劳动效率与产出质量","降低产品价格","减少税收"],1,"效率工资理论认为，高于市场出清水平的工资能降低怠工与流失、提高生产率，从而使单位劳动成本反而下降。","中级经济师·经济基础知识·第六章"),T("expansion","企业决定扩大产能时，最应优先考虑的约束条件是：",["只要盈利就应该无限扩产","预期需求能否持续消化新增产能","厂房面积是否最大","竞争对手是否也在扩产"],1,"扩产决策的核心是预期需求的持续性。若需求仅仅是周期性的短期繁荣，扩产会在需求回落时形成过剩产能与沉淀成本，这正是「加速原理」导致波动放大的原因。","中级经济师·经济基础知识·第三章"),T("rdInvest","从长期看，研发投入对一个企业最直接的作用是：",["立刻降低当期成本","提升全要素生产率，使同样投入产出更多","必然提高产品售价","减少税收负担"],1,"研发通过技术进步与工艺改进提高全要素生产率（TFP），使相同要素投入产生更多产出，是长期增长的根本来源，但短期表现为当期成本增加。","中级经济师·经济基础知 ","某工厂排放污染使下游居民健康受损却无需赔偿，这在经济学上属于：",["正外部性","负外部性","公共物品问题","信息不对称"],1,"负外部性指经济主体的行为给他人带来未计入市场交易的成本。矫正手段包括庇古税、排污权交易、明晰产权（科斯定理）等。","中级经济师·经济基础知识·第八章 市场失灵与政府干预"),T("externality","矫正负外部性的「庇古税」指的是：",["对污染企业发放补贴","按边际外部成本对污染者征税，使外部成本内部化","禁止一切工业生产","由居民自行承担污染"],1,"庇古税把污染的边际外部成本内部化为企业私人成本，使其产量达到社会最优水平。与之相对，科斯方案强调明晰产权下的私人谈判。","中级经济师·经济基础知识·第八章"),T("landValue","城市中心区地价远高于郊区，最根本的原因是：",["中心区土地质量更好","区位稀缺性与可达性带来的级差地租","政府强制规定","中心区建筑成本更高"],1,"地价由区位决定的级差地租驱动：可达性越高、集聚收益越大的地块，使用者愿意支付的地租越高，形成由中心向外递减的地价梯度。","中级经济师·经济基础知识·第三章 / 第八章"),T("density","城市开发密度提高可能带来的双重效应是：",["只提高集聚收益，没有代价","集聚收益上升，但拥堵、污染等规模不经济也随之上升","只增加污染","对经济没有任何影响"],1,"密度提高带来劳动力池共享、知识溢出与基础设施规模经济；同时带来拥堵、噪音、污染与生活成本上升，城市最优规模取决于两种力量的平衡。","中级经济师·经济基础知识·第八章"),T("amenity","学校、医院、供水等公共服务设施属于：",["纯粹的私人物品","具有外部收益的准公共物品","俱乐部物品中的纯私人部分","只由市场自发提供"],1,"公共服务具有非排他性或正外部性，私人供给会低于社会最优水平，因此通常由政府提供或补贴；完全非竞争非排他的才是纯公共物品。","中级经济师·经济基础知识·第八章"),T("landUse","在城市规划中把工业用地布置在城市主导风向的下风向，主要是为了：",["降低运输成本","减少工业污染对居住区的影响","提高地价","便于企业扩张"],1,"工业布局需考虑风向（下风向）、水流（下游）与地形，把污染型用地放在主导风向的下风向与河流下游，是控制负外部性空间扩散的常规手段。","中级经济师·经济基础知识·第八章"),T("congestion","城市规模扩大带来的拥堵成本，本质上属于：",["企业的内部成本","个体行为施加给他人的负外部性","政府财政支出","家庭储蓄的漏出"],1,"每个新增出行者都会降低他人通行速度，却不会为此付费，这是典型的负外部性。拥堵费、限行等政策正是为了内部化这一成本。","中级经济师·经济基础知识·第八章"),T("industrySubsidy","政府向特定产业发放补贴，长期看最需要警惕的风险是：",["补贴一定会导致企业立即倒闭","形成过剩产能与对补贴的依赖，降低资源配置效率","补贴会使物价必然下降","补贴对财政没有影响"],1,"补贴扭曲相对价格，可能保护低效企业、诱发产能过剩与寻租，退出时还会引发就业与债务问题；因此补贴通常需要设定期限与绩效条件。","中级经济师·经济基础知识·第八章 / 第九章 财政"),T("marketStructure","下列市场结构中，企业进入壁垒最高的是：",["完全竞争","垄断竞争","寡头垄断","完全垄断"],3,"完全垄断由单一厂商构成且无相近替代品，进入壁垒最高（法定、规模、技术或要素控制）；寡头次之，垄断竞争较低，完全竞争不存在壁垒。","中级经济师·经济基础知识·第四章"),T("monopolisticCompetition","垄断竞争市场的长期均衡特征是：",["价格等于边际成本，经济利润为零","价格高于边际成本，经济利润为零","价格高于边际成本且存在正经济利润","价格等于平均可变成本"],1,"垄断竞争厂商因产品差异而向下倾斜的需求曲线，均衡时 P > MC（存在过剩能力）；但自由进入使长期经济利润趋于零。","中级经济师·经济基础知识·第四章"),T("supplyChain","产业链上下游企业集聚布局，主要获得的好处是：",["完全消除市场风险","降低交易成本与运输成本，加快信息与技术扩散","必然形成垄断","使税收自动增加"],1,"产业链集聚降低了中间投入的运输与协调成本，促进了面对面交流与知识溢出，是区域竞争力的主要来源；但它不消除需求风险。","中级经济师·经济基础知识·第三章 / 第八章"),T("tradeOpenness","     <div id="app">
      <header id="topbar">
        <div class="top-row">
          <div class="brand">MacroVille <span class="sub">微观城邦</span></div>
          <button id="cycle-status" class="cycle-status" title="点击查看经济周期详情：当前阶段、景气指数与产出缺口"></button>
          <button id="quiz-status" class="quiz-status" title="点击打开学习档案：积分、奖杯与答题进度"></button>
          <div id="hud" class="hud"></div>
          <div id="controls" class="controls"></div>
        </div>
      </header>
      <nav id="tabs" class="tabs">
        <div id="cycle-bar" class="cycle-bar"></div>
        <div class="tab-group" id="tab-group"></div>
      </nav>
      <main>
        <section id="map-panel">
          <div id="stage-bar" class="stage-bar"></div>
          <div id="map-wrap">
            <div id="map-tools" class="map-tools"></div>
            <canvas id="city-canvas"></canvas>
            <div id="tile-info" class="tile-info hidden"></div>
            <div id="map-legend" class="map-legend"></div>
          </div>
        </section>
        <div id="splitter" class="splitter" title="拖动调整侧栏宽度"><span class="sp-grip"></span></div>
        <aside id="side">
          <div id="side-tabs" class="side-tabs">
            <button class="st active" data-pane="policy">政策</button>
            <button class="st" data-pane="dash">指标</button>
            <button class="st" data-pane="know">图谱</button>
          </div>
          <div id="side-body">
            <div class="pane active" id="pane-policy"><div id="policy" class="panel"></div></div>
            <div class="pane" id="pane-dash"><div id="dashboard" class="panel"></div></div>
            <div class="pane" id="pane-know"><div id="knowledge" class="panel"></div></div>
          </div>
        </aside>
      </main>
    </div>
    <div id="concept-modal" class="modal hidden"></div>
